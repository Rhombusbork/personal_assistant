<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>비서 대시보드</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1d2330; --muted: #6b7385; --line: #e3e6ec; --field: #f1f3f6;
    --lecture: #3b82f6; --quiz: #8b5cf6; --assignment: #f59e0b; --todo: #10b981; --busy: #9aa3b2;
    --danger: #ef4444; --warn: #f97316; --accent: #2563eb;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14171d; --card: #1d2129; --text: #e6e9ef; --muted: #98a0b0; --line: #2c323d; --field: #262b35;
            --busy: #4b5363; --accent: #60a5fa; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.5 "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; }
  main { max-width: 1240px; margin: 0 auto; padding: 20px 16px 40px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; margin-bottom: 14px; }
  h1 { font-size: 22px; margin: 0; }
  .sub { color: var(--muted); font-size: 12px; }
  .live { font-size: 11px; padding: 1px 8px; border-radius: 99px; background: var(--line); }
  .live.on { background: color-mix(in srgb, var(--todo) 20%, var(--card)); color: var(--todo); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .tile b { display: block; font-size: 24px; }
  .tile span { color: var(--muted); font-size: 12px; }
  .grid { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 16px; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; min-width: 0; }
  .card h2 { font-size: 15px; margin: 0 0 10px; }
  .stack { display: grid; gap: 16px; align-content: start; min-width: 0; }
  .warn { background: color-mix(in srgb, var(--warn) 12%, var(--card)); border-color: var(--warn); margin-bottom: 16px; }
  .warn ul { margin: 0; padding-left: 18px; }

  /* 입력 폼 */
  form { display: grid; gap: 10px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .row > label { font-size: 12px; color: var(--muted); min-width: 48px; }
  input, select, button { font: inherit; color: inherit; }
  input[type=text], input[type=date], input[type=time], select {
    background: var(--field); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; min-width: 0; }
  input.title { flex: 1 1 260px; font-size: 15px; }
  input.course { flex: 1 1 140px; }
  button { border: 1px solid var(--line); background: var(--field); border-radius: 8px; padding: 5px 10px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; padding: 7px 16px; font-weight: 600; }
  button.chip { font-size: 12px; padding: 3px 9px; border-radius: 99px; }
  .days { display: flex; gap: 4px; }
  .days input { display: none; }
  .days span { display: inline-block; width: 30px; text-align: center; padding: 3px 0; border-radius: 6px;
               border: 1px solid var(--line); background: var(--field); cursor: pointer; font-size: 12px; }
  .days input:checked + span { background: var(--todo); border-color: var(--todo); color: #fff; }
  .msg { font-size: 12px; color: var(--muted); }
  .msg.err { color: var(--danger); }
  .hint { font-size: 12px; color: var(--muted); }

  /* 주간 보드 */
  .board-wrap { overflow-x: auto; }
  .board { display: grid; grid-template-columns: 34px repeat(7, minmax(78px, 1fr)); min-width: 600px; }
  .board .head { text-align: center; font-weight: 600; padding: 4px 0 6px; font-size: 13px; }
  .board .head.today { color: var(--accent); }
  .axis, .day { position: relative; border-top: 1px solid var(--line); }
  .day { border-left: 1px solid var(--line); }
  .axis div { position: absolute; right: 6px; font-size: 11px; color: var(--muted); transform: translateY(-50%); }
  .hour { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--line); }
  .blk { position: absolute; left: 3px; right: 3px; border-radius: 6px; padding: 2px 5px; font-size: 11px; line-height: 1.3;
         overflow: hidden; color: #fff; border-left: 3px solid rgba(0,0,0,.25); }
  .blk.busy { background: var(--busy); }
  .blk.past { opacity: .45; }
  .blk small { opacity: .85; display: block; }
  .now { position: absolute; left: 0; right: 0; border-top: 2px solid var(--danger); z-index: 2; }

  /* 목록 */
  .due-day { margin: 10px 0 4px; font-weight: 600; font-size: 13px; display: flex; gap: 8px; align-items: center; }
  .badge { font-size: 11px; padding: 1px 7px; border-radius: 99px; background: var(--line); color: var(--text); }
  .badge.d0 { background: var(--danger); color: #fff; } .badge.d1 { background: var(--warn); color: #fff; }
  .badge.late { background: var(--text); color: var(--card); }
  .item { display: flex; gap: 8px; align-items: baseline; padding: 3px 0; font-size: 13px; }
  .item .txt { flex: 1; min-width: 0; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; transform: translateY(-1px); display: inline-block; }
  .course { color: var(--muted); }
  .acts { display: flex; gap: 3px; flex: none; opacity: .55; }
  .item:hover .acts { opacity: 1; }
  .acts button { padding: 0 6px; font-size: 12px; line-height: 20px; }
  .quick { display: flex; gap: 6px; margin-top: 10px; }
  .quick input { flex: 1; }

  /* 막대 */
  .bars { display: flex; align-items: flex-end; gap: 4px; height: 110px; position: relative; padding-top: 8px; }
  .bar { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; min-width: 0; }
  .bar i { display: block; width: 100%; border-radius: 4px 4px 0 0; background: var(--lecture); }
  .bar span { font-size: 10px; color: var(--muted); margin-top: 3px; white-space: nowrap; }
  .bar.over i { background: var(--danger); }
  .cap { position: absolute; left: 0; right: 0; border-top: 2px dashed var(--warn); }
  .prog { margin: 8px 0; }
  .prog .r { display: flex; justify-content: space-between; font-size: 13px; }
  .prog .track { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; margin-top: 3px; }
  .prog .fill { height: 100%; background: var(--todo); }
  .legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; color: var(--muted); margin-top: 8px; }
  .legend span { display: inline-flex; align-items: center; gap: 4px; }
  .empty { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<main>
  <header>
    <h1 id="clock">대시보드</h1>
    <span id="live" class="live">읽는 중…</span>
    <span id="status" class="sub"></span>
  </header>
  <div id="tiles" class="tiles"></div>
  <div id="warn"></div>
  <div class="grid">
    <div class="stack">
      <div class="card" id="addCard">
        <h2>➕ 할 일 추가</h2>
        <form id="addForm" autocomplete="off">
          <div class="row"><input class="title" name="title" type="text" placeholder="무엇을 할까요? (예: 리바이어던 발표자료 제출)" required></div>
          <div class="row">
            <label>마감</label>
            <input name="date" type="date">
            <input name="time" type="time" title="몇 시까지 (비우면 23:59)"> <span class="hint">까지</span>
            <button type="button" class="chip" data-day="0">오늘</button>
            <button type="button" class="chip" data-day="1">내일</button>
            <button type="button" class="chip" data-day="fri">이번 주 금</button>
            <button type="button" class="chip" data-day="clear">기한 없음</button>
          </div>
          <div class="row">
            <label>예상</label>
            <select name="minutes">
              <option value="30">30분</option><option value="60" selected>1시간</option><option value="90">1시간 30분</option>
              <option value="120">2시간</option><option value="180">3시간</option><option value="240">4시간</option>
            </select>
            <label>분류</label>
            <input class="course" name="course" type="text" list="courses" placeholder="과목·분류 (선택)">
            <datalist id="courses"></datalist>
          </div>
          <div class="row">
            <label>반복</label>
            <div class="days" id="days"></div>
            <span class="hint">매주 고른 요일에 (마감 날짜는 무시)</span>
          </div>
          <div class="row"><button class="primary" type="submit">추가</button><span id="addMsg" class="msg"></span></div>
        </form>
      </div>
      <div class="card"><h2>🗓 이번 주 계획</h2><div class="board-wrap" id="board"></div><div class="legend" id="legend"></div></div>
      <div class="card"><h2>📊 일별 학습량 (계획, 점선 = 하루 한도)</h2><div id="load"></div></div>
    </div>
    <div class="stack">
      <div class="card">
        <h2>💭 하고 싶은 일 <span class="hint">(기한 없음)</span></h2>
        <div id="someday"></div>
        <form class="quick" id="somedayForm" autocomplete="off">
          <input type="text" name="title" placeholder="하고 싶은 일 추가" required><button type="submit">추가</button>
        </form>
      </div>
      <div class="card"><h2>⏰ 다가오는 마감</h2><div id="dues"></div></div>
      <div class="card"><h2>📚 과목별 진행 <span class="hint">(추적한 항목 중 완료)</span></h2><div id="prog"></div></div>
      <div class="card"><h2>✅ 완료 추이 (14일)</h2><div id="trend"></div></div>
    </div>
  </div>
</main>
<script src="data.js"></script>
<script>
// 대시보드. 감시기 서버(localhost:8765)로 열면 30초마다 최신 데이터를 받고 입력도 된다.
// 파일로 직접 열거나 Live Server 로 열면 data.js(마지막 실행 결과)로 보기만 한다.
// '지금'은 항상 이 컴퓨터의 시계를 쓴다.
const KIND = { lecture: "강의", quiz: "퀴즈", assignment: "과제", todo: "할 일" };
const WD = "일월화수목금토";
let D = window.PA_DATA || null;
let LIVE = false;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const color = k => `var(--${k})`;
const pad = n => String(n).padStart(2, "0");
const ymdOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const dateOf = s => new Date(s);
const ymd = iso => ymdOf(dateOf(iso));
const hm = iso => { const d = dateOf(iso); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const mins = iso => { const d = dateOf(iso); return d.getHours() * 60 + d.getMinutes(); };
const addDays = (ymdStr, n) => { const d = new Date(ymdStr + "T12:00:00"); d.setDate(d.getDate() + n); return ymdOf(d); };
const label = y => { const d = new Date(y + "T12:00:00"); return `${d.getMonth() + 1}/${d.getDate()}(${WD[d.getDay()]})`; };
const daysBetween = (a, b) => Math.round((new Date(b + "T12:00:00") - new Date(a + "T12:00:00")) / 864e5);
const tick = (d, all) => all.indexOf(d) % 2 ? "&nbsp;" : `${+d.slice(5, 7)}/${+d.slice(8)}`;
const stamp = iso => iso ? `${label(ymd(iso))} ${hm(iso)}` : "-";

async function load() {
  try {
    const r = await fetch("/api/data", { cache: "no-store" });
    if (!r.ok) throw 0;
    D = await r.json(); LIVE = true;
  } catch { LIVE = false; }
  render();
}

async function post(action, body) {
  const r = await fetch("/api/" + action, {
    method: "POST", headers: { "Content-Type": "application/json", "X-PA": "1" }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || "실패");
  await load();
  return j;
}

function actButtons(t) {
  if (!LIVE) return "";
  const k = esc(t.key);
  let b = `<button title="완료" data-act="done" data-key="${k}">✓</button>`;
  b += t.source === "inbox"
    ? `<button title="삭제" data-act="remove" data-key="${k}">🗑</button>`
    : `<button title="계속 제외 (조장만 제출 등)" data-act="ignore" data-key="${k}">✕</button>`;
  return `<span class="acts">${b}</span>`;
}

function render() {
  const now = new Date();
  const today = ymdOf(now);
  const nowMin = now.getHours() * 60 + now.getMinutes();
  $("clock").textContent = `${label(today)} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
  $("live").textContent = LIVE ? "실시간" : "보기 전용";
  $("live").className = "live" + (LIVE ? " on" : "");
  $("live").title = LIVE ? "감시기 서버에 연결됨 — 30초마다 갱신, 입력 가능"
                         : "감시기가 꺼져 있거나 파일로 열었음 — 입력하려면 감시기를 켜고 http://localhost:8765 에서 여세요";
  $("addCard").style.display = LIVE ? "" : "none";
  $("somedayForm").style.display = LIVE ? "" : "none";
  if (!D) { $("status").textContent = "데이터 없음 — bin/pa run 을 실행하세요"; return; }
  $("status").textContent = `계획 ${stamp(D.plannedAt)} · Canvas 확인 ${stamp(D.canvasSynced)}`;

  const [ds, de] = [D.dayStart, D.dayEnd].map(t => +t.slice(0, 2));
  const days7 = [...Array(7)].map((_, i) => addDays(today, i));
  const days14 = [...Array(14)].map((_, i) => addDays(today, i));
  const planMin = d => D.plan.filter(p => ymd(p.start) === d).reduce((s, p) => s + mins(p.end) - mins(p.start), 0);
  const open = D.tasks.filter(t => dateOf(t.due) >= now);
  const late = D.tasks.filter(t => dateOf(t.due) < now);
  const soon = open.filter(t => daysBetween(today, ymd(t.due)) <= 3);
  const doneTotal = Object.values(D.doneByDay).reduce((a, b) => a + b, 0);
  const todayLeft = D.plan.filter(p => ymd(p.start) === today && dateOf(p.end) > now)
                          .reduce((s, p) => s + (dateOf(p.end) - Math.max(dateOf(p.start), now)) / 6e4, 0);

  $("tiles").innerHTML = `
    <div class="tile"><b>${open.length}</b><span>남은 할 일 (3주)</span></div>
    <div class="tile"><b>${(todayLeft / 60).toFixed(1)}h</b><span>오늘 남은 계획 / 한도 ${D.cap / 60}h</span></div>
    <div class="tile"><b style="color:${soon.length ? "var(--warn)" : "inherit"}">${soon.length}</b><span>3일 안 마감</span></div>
    <div class="tile"><b>${doneTotal}</b><span>최근 2주 완료</span></div>`;

  const warns = [...D.warnings];
  if (!LIVE) warns.unshift("감시기가 꺼져 있어 마지막으로 만든 데이터를 보여 주는 중입니다. VSCode 에서 '작업 실행 → 비서: 자동 감시' 를 켜세요.");
  $("warn").innerHTML = warns.length ? `<div class="card warn"><h2>⚠️ 확인 필요</h2><ul>${
    warns.map(w => `<li>${esc(w).replace(/`([^`]+)`/g, "<code>$1</code>")}</li>`).join("")}</ul></div>` : "";

  $("courses").innerHTML = (D.courses || []).map(c => `<option value="${esc(c)}">`).join("");

  // --- 주간 보드 (오늘부터 7일)
  const PX = 38, H = (de - ds) * PX;
  const y = m => (m - ds * 60) / 60 * PX;
  let board = `<div class="board"><div></div>` +
    days7.map(d => `<div class="head ${d === today ? "today" : ""}">${label(d)}</div>`).join("") +
    `<div class="axis" style="height:${H}px">` + [...Array(de - ds)].map((_, i) => `<div style="top:${i * PX}px">${ds + i}</div>`).join("") + `</div>`;
  for (const d of days7) {
    let col = [...Array(de - ds)].map((_, i) => `<div class="hour" style="top:${i * PX}px"></div>`).join("");
    const blocks = [...D.busy.filter(b => ymd(b.start) === d).map(b => ({ ...b, busy: true })), ...D.plan.filter(p => ymd(p.start) === d)];
    for (const b of blocks) {
      const top = Math.max(0, y(mins(b.start))), h = Math.min(H, y(mins(b.end))) - top;
      if (h <= 0) continue;
      const past = dateOf(b.end) <= now ? " past" : "";
      const text = b.busy ? esc(b.label) : esc(b.summary.replace(/^\[[^\]]+\]\s*/, ""));
      col += `<div class="blk${b.busy ? " busy" : ""}${past}" style="top:${top}px;height:${h}px;${b.busy ? "" : "background:" + color(b.kind)}"
        title="${esc(b.summary || b.label)}">${text}<small>${hm(b.start)}–${hm(b.end)}</small></div>`;
    }
    if (d === today && nowMin >= ds * 60 && nowMin <= de * 60) col += `<div class="now" style="top:${y(nowMin)}px"></div>`;
    board += `<div class="day" style="height:${H}px">${col}</div>`;
  }
  $("board").innerHTML = board + `</div>`;
  $("legend").innerHTML = Object.entries(KIND).map(([k, v]) => `<span><i class="dot" style="background:${color(k)}"></i>${v}</span>`).join("")
    + `<span><i class="dot" style="background:var(--busy)"></i>수업·약속</span>`;

  // --- 다가오는 마감 (지난 것 + 14일)
  const item = t => `<div class="item"><span class="dot" style="background:${color(t.kind)}"></span>
    <span class="txt">${hm(t.due)} <span class="course">${esc(t.course)}</span> ${esc(t.title)}</span>${actButtons(t)}</div>`;
  let dues = late.length ? `<div class="due-day">지난 마감 <span class="badge late">미완료</span></div>` + late.map(item).join("") : "";
  for (const d of days14) {
    const items = open.filter(t => ymd(t.due) === d);
    if (!items.length) continue;
    const n = daysBetween(today, d);
    dues += `<div class="due-day">${label(d)} <span class="badge d${Math.min(n, 2)}">${n === 0 ? "오늘" : "D-" + n}</span></div>` + items.map(item).join("");
  }
  $("dues").innerHTML = dues || `<p class="empty">2주 안 마감 없음</p>`;

  // --- 하고 싶은 일
  $("someday").innerHTML = D.someday.length
    ? D.someday.map(t => `<div class="item"><span class="dot" style="background:var(--todo)"></span>
        <span class="txt">${t.course ? `<span class="course">${esc(t.course)}</span> ` : ""}${esc(t.title)}</span>${actButtons(t)}</div>`).join("")
    : `<p class="empty">아직 없음</p>`;

  // --- 일별 부하
  const maxLoad = Math.max(D.cap, ...days14.map(planMin));
  $("load").innerHTML = `<div class="bars"><div class="cap" style="bottom:${D.cap / maxLoad * 100}%"></div>` +
    days14.map(d => { const m = planMin(d); return `<div class="bar ${m > D.cap ? "over" : ""}" title="${label(d)} ${Math.round(m / 6) / 10}시간">
      <i style="height:${m / maxLoad * 100}%"></i><span>${tick(d, days14)}</span></div>`; }).join("") + `</div>`;

  // --- 완료 추이
  const past14 = [...Array(14)].map((_, i) => addDays(today, i - 13));
  const maxDone = Math.max(1, ...past14.map(d => D.doneByDay[d] || 0));
  $("trend").innerHTML = `<div class="bars">` + past14.map(d => `<div class="bar" title="${label(d)} ${D.doneByDay[d] || 0}건">
    <i style="height:${(D.doneByDay[d] || 0) / maxDone * 100}%;background:var(--todo)"></i><span>${tick(d, past14)}</span></div>`).join("") + `</div>`;

  // --- 과목별 진행
  $("prog").innerHTML = D.progress.map(p => `<div class="prog"><div class="r"><span>${esc(p.course)}</span><span>${p.done}/${p.total}</span></div>
    <div class="track"><div class="fill" style="width:${p.total ? p.done / p.total * 100 : 0}%"></div></div></div>`).join("") || `<p class="empty">아직 없음</p>`;
}

// ---- 입력
$("days").innerHTML = ["월", "화", "수", "목", "금", "토", "일"].map((d, i) =>
  `<label><input type="checkbox" name="every" value="${i}"><span>${d}</span></label>`).join("");

document.querySelectorAll("[data-day]").forEach(b => b.addEventListener("click", () => {
  const f = $("addForm"), v = b.dataset.day, d = new Date();
  if (v === "clear") { f.date.value = ""; f.time.value = ""; return; }
  if (v === "fri") d.setDate(d.getDate() + ((5 - d.getDay() + 7) % 7));
  else d.setDate(d.getDate() + +v);
  f.date.value = ymdOf(d);
}));

$("addForm").addEventListener("submit", async e => {
  e.preventDefault();
  const f = e.target, msg = $("addMsg");
  const body = { title: f.title.value, date: f.date.value, time: f.time.value, minutes: f.minutes.value,
                 course: f.course.value, every: [...f.querySelectorAll("[name=every]:checked")].map(x => x.value) };
  msg.className = "msg"; msg.textContent = "반영 중…";
  try {
    const r = await post("add", body);
    msg.textContent = "추가됨: " + r.message.replace(/^- \[ \] /, "");
    f.reset();
  } catch (err) { msg.className = "msg err"; msg.textContent = err.message; }
});

$("somedayForm").addEventListener("submit", async e => {
  e.preventDefault();
  try { await post("add", { title: e.target.title.value }); e.target.reset(); }
  catch (err) { alert(err.message); }
});

document.addEventListener("click", async e => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  if (b.dataset.act === "remove" && !confirm("이 할 일을 지울까요?")) return;
  b.disabled = true;
  try { await post(b.dataset.act, { key: b.dataset.key }); } catch (err) { alert(err.message); b.disabled = false; }
});

load();
setInterval(load, 30 * 1000);  // 30초마다 시계·데이터 갱신
</script>
</body>
</html>
