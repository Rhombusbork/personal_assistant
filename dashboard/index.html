<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>비서 대시보드</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="theme-color" content="#0066cc">
<meta name="color-scheme" content="light dark">
<style>
  /* 시안 A "차분한 집중" — 색은 의미(종류 점 + 강조 하나)에만, 구분은 상자 대신 글자 크기·굵기·회색 단계로.
     간격은 8의 배수만 쓴다 (4 는 글자 사이 미세 조정에만). */
  /* A-1: 회색 3단계는 그대로 두되 모두 4.5:1 이상 (text3 2.57 → 5.07). 강조색(파랑)은 '누를 수 있음·지금'에만,
     종류 색은 파랑을 피한 4색 + 회색(할 일). 원형 테두리는 비텍스트 대비 3:1 이상 (WCAG 1.4.11). */
  :root {
    --bg: #ffffff; --elev: #ffffff; --text: #1d1d1f; --text2: #545458; --text3: #6e6e73;
    --line: rgba(0, 0, 0, .09); --fill: rgba(0, 0, 0, .035); --fill2: rgba(0, 0, 0, .065);
    --accent: #0066cc; --accent-fill: #0066cc; --on-accent: #ffffff; --danger: #d70015; --warn: #b45309; --shadow: 0 8px 32px rgba(0, 0, 0, .14), 0 1px 3px rgba(0, 0, 0, .08);
    --lecture: #0f8a7e; --quiz: #7c3aed; --assignment: #d97706; --todo: #8e8e93; --review: #db2777; --busy: #c7c7cc;
    --s1: 8px; --s2: 16px; --s3: 24px; --s4: 32px; --s5: 40px; --s6: 48px;
    --hit: 44px;  /* Apple HIG 44pt · WCAG 2.5.5 */
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161617; --elev: #232325; --text: #f5f5f7; --text2: #a1a1a6; --text3: #8a8a8f;
      --line: rgba(255, 255, 255, .1); --fill: rgba(255, 255, 255, .05); --fill2: rgba(255, 255, 255, .09);
      --accent: #2997ff; --accent-fill: #0a6cd6; --danger: #ff6961; --warn: #fbbf24; --busy: #48484a; --shadow: 0 8px 32px rgba(0, 0, 0, .5);
      --lecture: #2dd4bf; --quiz: #a78bfa; --assignment: #fbbf24; --todo: #8e8e93; --review: #f472b6;
    }
  }
  :root[data-theme="dark"] {
    --bg: #161617; --elev: #232325; --text: #f5f5f7; --text2: #a1a1a6; --text3: #8a8a8f;
    --line: rgba(255, 255, 255, .1); --fill: rgba(255, 255, 255, .05); --fill2: rgba(255, 255, 255, .09);
    --accent: #2997ff; --accent-fill: #0a6cd6; --danger: #ff6961; --warn: #fbbf24; --busy: #48484a; --shadow: 0 8px 32px rgba(0, 0, 0, .5);
    --lecture: #2dd4bf; --quiz: #a78bfa; --assignment: #fbbf24; --todo: #8e8e93; --review: #f472b6;
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", "NanumBarunGothic", "NanumGothic", system-ui, sans-serif;
         -webkit-font-smoothing: antialiased; }
  main { max-width: 720px; margin: 0 auto; padding: var(--s5) var(--s3) 96px; }
  @media (max-width: 600px) { main { padding: var(--s3) var(--s2) 96px; } }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .num { font-variant-numeric: tabular-nums; }

  /* ---- 머리 */
  header { display: grid; grid-template-columns: 1fr auto; align-items: end; gap: var(--s1) var(--s2); }
  .eyebrow { font-size: 13px; color: var(--text2); display: flex; align-items: center; gap: 6px; }
  .live { width: 8px; height: 8px; border-radius: 50%; background: #1f9d55; display: inline-block; flex: none; }
  .live.stale { background: var(--warn); }
  .live.off { background: var(--danger); }
  .status { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; }
  .status .sep { color: var(--text3); }
  .status .st-bad { color: var(--danger); font-weight: 600; }
  .status .st-warn { color: var(--warn); font-weight: 600; }
  .status .job, .status .tmr { color: var(--text); font-weight: 500; border: 0; background: none; padding: 0; font-size: 13px; display: inline-flex; gap: 4px; align-items: center; }
  .status .tmr { color: var(--accent); font-variant-numeric: tabular-nums; }
  .spin { width: 10px; height: 10px; border: 2px solid var(--fill2); border-top-color: var(--accent); border-radius: 50%; display: inline-block; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size: 32px; line-height: 1.15; letter-spacing: -.02em; margin: 0; font-weight: 700; }
  .hdr-tools { display: flex; gap: var(--s1); align-items: center; }
  .seg { display: inline-flex; background: var(--fill2); border-radius: 9px; padding: 2px; }
  .seg button { border: 0; background: none; padding: 4px 14px; min-height: 32px; border-radius: 7px; font-size: 13px; color: var(--text2); }
  .seg button.on { background: var(--elev); color: var(--text); font-weight: 600; box-shadow: 0 1px 2px rgba(0, 0, 0, .12); }
  .hdr-eye { grid-column: 1 / -1; margin-bottom: -8px; }
  .summary { grid-column: 1 / -1; margin: 0; font-size: 14px; color: var(--text2); }
  .summary b { color: var(--text); font-weight: 600; }
  .summary .bad { color: var(--danger); font-weight: 700; text-decoration: none; }
  .summary a.bad:hover { text-decoration: underline; }
  html { scroll-padding-top: 24px; }

  .icon-btn { width: 40px; height: 40px; border: 0; border-radius: 8px; background: transparent; color: var(--text2);
              display: inline-grid; place-items: center; font-size: 17px; line-height: 1; padding: 0; flex: none; }
  .icon-btn:hover { background: var(--fill2); color: var(--text); }

  /* ---- 빠른 입력 */
  .quick { margin-top: var(--s3); display: flex; align-items: center; gap: var(--s1); border-bottom: 1px solid var(--line); padding-bottom: var(--s1); }
  .quick .plus { color: var(--accent); font-size: 20px; width: 24px; text-align: center; line-height: 1; }
  .quick input { flex: 1; min-width: 0; border: 0; background: none; padding: 8px 0; font-size: 15px; outline: none; }
  .quick input::placeholder { color: var(--text3); }
  .link { border: 0; background: none; color: var(--accent); padding: 4px 0; min-height: 32px; font-size: 13px; }
  .link:hover { text-decoration: underline; }
  .link.muted { color: var(--text2); }
  kbd { font: 11px/1 inherit; color: var(--text3); border: 1px solid var(--line); border-radius: 4px; padding: 2px 5px; }
  .full { display: grid; gap: var(--s1); padding: var(--s2) 0 var(--s1) 32px; }
  .full[hidden] { display: none; }
  .frow { display: flex; flex-wrap: wrap; gap: var(--s1); align-items: center; }
  .frow > .lbl { font-size: 13px; color: var(--text2); width: 40px; }
  .field { background: var(--fill); border: 1px solid transparent; border-radius: 8px; padding: 6px 10px; min-width: 0; }
  .field:focus { border-color: var(--accent); outline: none; }
  .chip { border: 0; background: var(--fill2); border-radius: 99px; padding: 4px 12px; font-size: 13px; }
  .chip:hover { background: color-mix(in srgb, var(--accent) 14%, transparent); }
  .days { display: flex; gap: 4px; }
  .days input { position: absolute; opacity: 0; pointer-events: none; }
  .days span { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: var(--fill); font-size: 13px; cursor: pointer; }
  .days input:checked + span { background: var(--accent-fill); color: var(--on-accent); }

  /* ---- 버튼 */
  .btn { height: var(--hit); padding: 0 var(--s2); border: 0; border-radius: 10px; background: var(--fill2); font-size: 15px; font-weight: 600; white-space: nowrap; }
  .btn:hover { filter: brightness(.97); }
  .btn.primary { background: var(--accent-fill); color: var(--on-accent); }
  .btn.plain { background: transparent; color: var(--accent); padding: 0 12px; }
  .btn.plain:hover { background: var(--fill); }
  .tbtn { border: 0; background: none; color: var(--accent); font-size: 13px; font-weight: 600; padding: 4px 8px; min-height: 32px; border-radius: 6px; white-space: nowrap; }
  .tbtn:hover { background: var(--fill2); }
  .tbtn.gray { color: var(--text2); font-weight: 500; }

  /* ---- 지금 할 일 (주인공) */
  .hero { margin-top: var(--s5); }
  .hero .eyebrow { color: var(--accent); font-weight: 600; }
  .hero .eyebrow .sep { color: var(--text3); font-weight: 400; }
  .hero-head { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: start; margin-top: var(--s1); }
  .hero-title { font-size: 24px; line-height: 1.3; letter-spacing: -.015em; margin: 0; font-weight: 700; overflow-wrap: anywhere; }
  .hero .ck i { width: 26px; height: 26px; }
  .hero .ck { margin-top: -6px; }
  .hero-meta { font-size: 14px; color: var(--text2); margin-top: 4px; }
  .hero-body { min-width: 0; }
  .bar { height: 4px; border-radius: 99px; background: var(--fill2); margin-top: var(--s2); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
  .hero-acts { display: flex; flex-wrap: wrap; gap: var(--s1); margin-top: var(--s2); align-items: center; }
  .why { font-size: 13px; color: var(--text3); margin: var(--s1) 0 0; }
  .timer-num { font-size: 40px; font-weight: 300; letter-spacing: -.02em; font-variant-numeric: tabular-nums; margin-top: var(--s1); }

  /* ---- 확인할 것 (하나로 접음) */
  details > summary { list-style: none; cursor: pointer; }
  details > summary::-webkit-details-marker { display: none; }
  .chev { display: inline-block; color: var(--text3); transition: transform .15s; font-size: 13px; }
  details[open] > summary .chev { transform: rotate(90deg); }
  .check { margin-top: var(--s4); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .check > summary { display: flex; align-items: center; gap: 12px; padding: 12px 0; min-height: 48px; }
  .check > summary:hover .ttl { color: var(--accent); }
  .cnt { min-width: 24px; height: 24px; padding: 0 7px; border-radius: 12px; background: var(--fill2); font-size: 13px; font-weight: 600;
         display: inline-grid; place-items: center; }
  .cnt.hot { background: var(--accent-fill); color: var(--on-accent); }
  .check > summary .chev { margin-left: auto; }
  .check .ttl { font-weight: 600; }
  .check .hint { flex: 1; min-width: 0; color: var(--text2); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .check-body { padding: 0 0 var(--s2) 36px; }
  @media (max-width: 600px) { .check-body { padding-left: 0; } }
  .cgrp { margin-top: var(--s2); }
  .cgrp:first-child { margin-top: 0; }
  .cgrp-h { font-size: 13px; font-weight: 600; color: var(--text2); margin: 0 0 4px; display: flex; gap: var(--s1); align-items: baseline; }
  .cgrp-h .tbtn { margin-left: auto; }
  .citem { display: flex; gap: var(--s1); align-items: baseline; padding: 6px 0; font-size: 14px; }
  .citem .tx { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .citem .tx small { display: block; color: var(--text2); font-size: 13px; }
  .citem .ac { display: flex; gap: 2px; flex: none; flex-wrap: wrap; justify-content: flex-end; }
  .citem code { font-size: 12px; background: var(--fill2); border-radius: 4px; padding: 0 4px; }
  .dl-sel { font-size: 12px; padding: 2px 4px; border-radius: 6px; border: 0; background: var(--fill2); max-width: 96px; }
  .clist { margin: 0; padding-left: 18px; font-size: 14px; color: var(--text); }
  .clist li { margin: 2px 0; }
  .clist li::marker { color: var(--text3); }

  /* ---- 심각도 위로 꺼내기: 행동이 필요한 경고만 '확인할 것' 위에 한 줄씩 (상자 없이, 빨간 표시 하나) */
  .crit { margin-top: var(--s4); display: grid; }
  .crit + .check { margin-top: 0; }
  .cline { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 0 12px; align-items: center; padding: 8px 0; min-height: 48px;
           border-top: 1px solid var(--line); font-size: 14px; }
  .cline .ic { width: 20px; height: 20px; border-radius: 50%; background: var(--danger); color: var(--bg); font-size: 13px; font-weight: 800;
               display: grid; place-items: center; line-height: 1; }
  .cline.warn .ic { background: var(--warn); }
  .cline .tx b { font-weight: 600; }
  .cline .tx small { display: block; color: var(--text2); font-size: 13px; }
  .cline .tbtn { min-height: var(--hit); padding: 0 12px; }
  .cline.lateline { grid-template-columns: 20px minmax(0, 1fr); }
  .cline.lateline > span:last-child { grid-column: 2; }
  .lacts { display: flex; flex-wrap: wrap; gap: 0 2px; margin-left: -12px; }
  .lacts .tbtn { min-height: 36px; }

  /* ---- 섹션 */
  .sec { margin-top: var(--s5); }
  .sec-h { display: flex; align-items: baseline; gap: var(--s1); margin: 0 0 var(--s1); }
  .sec-h h2 { font-size: 20px; letter-spacing: -.01em; margin: 0; font-weight: 700; }
  .sec-h .aside { color: var(--text2); font-size: 13px; }
  .sec-h .link { margin-left: auto; }

  /* ---- 줄 (타임라인·마감 공통) */
  .rows { display: grid; }
  .row { display: grid; grid-template-columns: 56px 20px minmax(0, 1fr) auto; gap: 0 12px; align-items: start; padding: 8px; margin: 0 -8px; border-radius: 10px; }
  .row.nt { grid-template-columns: 20px minmax(0, 1fr) auto; }
  .row:hover { background: var(--fill); }
  .row .t { font-size: 14px; color: var(--text2); padding-top: 1px; line-height: 1.35; }
  .row .t small { display: block; color: var(--text3); font-size: 12px; }
  .row .body { min-width: 0; }
  .row .ttl { font-size: 15px; font-weight: 500; overflow-wrap: anywhere; line-height: 1.4; }
  .row .meta { font-size: 13px; color: var(--text2); margin-top: 2px; }
  .row { position: relative; }
  .row[tabindex]:focus-visible { outline-offset: 0; border-radius: 10px; }
  .row .ra { display: flex; align-items: center; gap: 2px; margin-top: -8px; }
  /* 인식 > 회상: 주 행동을 마우스 없이도 항상 보인다 — 평소엔 회색, 줄에 올리거나 포커스면 강조색 */
  .row .ra .tbtn { color: var(--text2); font-weight: 500; }
  .row:hover .ra .tbtn, .row:focus-within .ra .tbtn, .row.sel .ra .tbtn { color: var(--accent); font-weight: 600; }
  .row .ra .icon-btn { width: 36px; height: 36px; color: var(--text2); }
  .row .ra .pico { display: none; }
  .row.sel { background: var(--fill); }
  /* 지난 줄: 투명도 .4 는 대비 2:1 미만 → 글자는 text3(5.07:1)로만 물린다 */
  .row.past .ttl, .row.past .t, .row.past .t small, .row.past .meta { color: var(--text3); font-weight: 400; }
  .row.past .ck, .row.past .bmark { opacity: .5; }
  .row.cur .t { color: var(--accent); font-weight: 600; }
  .row.cur .t small { color: var(--accent); font-weight: 400; }
  .row.busy .ttl { color: var(--text2); font-weight: 400; }
  .bmark { width: 4px; height: 20px; border-radius: 2px; background: var(--busy); margin: 1px auto 0; }
  /* 터치 기기·폰: 줄 전체를 누르면 행동 시트, 오른쪽에 44px 주 행동 아이콘 하나 (⋯ 없이 닿는다) */
  @media (max-width: 600px), (pointer: coarse) {
    .row .ra .tbtn, .row .ra [data-menu] { display: none; }
    .row .ra .pico { display: inline-grid; width: auto; min-width: var(--hit); height: var(--hit); padding: 0 6px; color: var(--accent); font-size: 14px; font-weight: 600; margin: -4px -6px 0 0; }
    .row .ra .pico:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }
    .icon-btn { width: var(--hit); height: var(--hit); }
    .seg button { min-height: 40px; }
    .row { cursor: pointer; }
  }
  @media (max-width: 600px) {
    .row { grid-template-columns: 44px 20px minmax(0, 1fr) auto; gap: 0 10px; }
    .row.nt { grid-template-columns: 20px minmax(0, 1fr) auto; }
    .gap { padding-left: 62px !important; }
    .quick kbd, .kbhint { display: none; }
  }
  .gap { padding: 4px 0 4px 76px; font-size: 12px; color: var(--text3); }
  .late { color: var(--danger); font-weight: 700; }
  .soon { color: var(--text); font-weight: 600; }
  .plan-tag { color: var(--accent); }
  /* 같은 일을 두 번 그리지 않는다: 주인공 블록 자리는 타임라인에서 얇은 한 줄 */
  .ptr { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 0 12px; padding: 4px 8px; margin: 0 -8px; font-size: 13px; color: var(--accent); align-items: baseline; }
  .ptr .t { font-weight: 600; }
  .ptr span:last-child { color: var(--text2); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ptr span:last-child b { color: var(--accent); font-weight: 600; }
  @media (max-width: 600px) { .ptr { grid-template-columns: 44px minmax(0, 1fr); gap: 0 10px; } }
  .clip { color: var(--text3); font-size: 12px; margin-left: 4px; white-space: nowrap; }

  /* 원형 체크 — 종류 색이 곧 테두리 (색 = 의미) */
  /* 피츠의 법칙: 보이는 원은 20px 그대로, 누르는 영역은 44×44 (바깥 여백을 음수로 겹쳐 줄 높이는 그대로) */
  .ck { width: var(--hit); height: var(--hit); margin: -11px -12px; padding: 0; border: 0; background: none; border-radius: 50%;
        display: grid; place-items: center; position: relative; z-index: 1; }
  .ck i { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--k, var(--text3)); display: grid; place-items: center;
          color: transparent; font-size: 12px; font-style: normal; line-height: 1; transition: background .12s; }
  .ck:hover i { background: color-mix(in srgb, var(--k) 16%, transparent); color: var(--k); }
  .ck.on i { background: var(--k); color: #fff; }
  .ck.overdue i { border-width: 2.5px; }

  .day-h { font-size: 13px; font-weight: 600; color: var(--text2); margin: var(--s2) 0 0; display: flex; gap: var(--s1); align-items: baseline; }
  .day-h:first-child { margin-top: 0; }
  .day-h .d { color: var(--text3); font-weight: 400; }
  .day-h.today { color: var(--accent); }
  .day-h.danger { color: var(--danger); font-size: 14px; }
  .day-h.danger .d { color: var(--text2); font-weight: 400; }
  .empty { color: var(--text3); font-size: 14px; margin: var(--s1) 0; }
  .foot { margin-top: var(--s2); font-size: 13px; color: var(--text2); }
  .done-l { margin-top: 4px; }
  .done-l div { text-decoration: line-through; color: var(--text3); font-size: 14px; }

  /* ---- 주차별 */
  .wk-nav { display: flex; align-items: center; gap: var(--s1); flex-wrap: wrap; }
  .wk-nav b { font-size: 17px; }
  .wk-nav .r { color: var(--text2); font-size: 13px; }
  .wk-nav .push { margin-left: auto; }
  .strip { display: flex; gap: 3px; margin: var(--s2) 0 var(--s1); align-items: flex-end; }
  .sw { flex: 1; min-width: 0; border: 0; background: none; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .sw i { display: block; width: 100%; max-width: 20px; border-radius: 3px; background: var(--fill2); }
  .sw span { font-size: 11px; color: var(--text3); line-height: 1; }
  .sw.past i { opacity: .5; }
  .sw.cur span { color: var(--text); font-weight: 600; }
  .sw.sel i { background: var(--accent); }
  .sw.sel span { color: var(--accent); font-weight: 700; }
  .sw em { font-style: normal; width: 4px; height: 4px; border-radius: 50%; background: var(--danger); }
  .sw:not(.ex) em { visibility: hidden; }
  .strip-note { font-size: 12px; color: var(--text3); margin: 0; }

<script>
// 비서 대시보드 (디자인: 시안 A-1 '차분한 집중 + 사용성 평가', docs/design-research.md · dashboard/designs/a1-usability.md).
// 엔진(localhost:8765)으로 열면 30초마다 최신 데이터 + 입력. 파일로 열면 data.js 로 보기만. 휴대폰(GitHub Pages)은 잠긴 데이터를 풀어서.
// 예전 화면: legacy.html
const KIND = { lecture: "강의", quiz: "퀴즈", assignment: "과제", todo: "할 일", review: "퀴즈 복습" };
const WD = "일월화수목금토";
let D = null, LIVE = false, view = "today", wkIdx = null;
const AI = () => (D && D.ai) || "AI";  // 설정한 AI 이름 (Claude / Codex)
try { view = localStorage.getItem("pa.view") === "week" ? "week" : "today"; } catch {}
const UI = { open: new Set(), allDues: false, allDl: false, menuKey: null, menuFrom: null, sheetFrom: null, sel: null };  // 다시 그려도 펼친 상태 유지
let HERO_KEY = null;  // 주인공 영역에 크게 나온 일 — 아래 목록에서는 다시 그리지 않는다 (DRY)
const COARSE = matchMedia("(max-width: 600px), (pointer: coarse)");

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = n => String(n).padStart(2, "0");
const ymdOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const dt = s => new Date(s);
const ymd = iso => ymdOf(dt(iso));
const hm = iso => { const d = dt(iso); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const mins = iso => { const d = dt(iso); return d.getHours() * 60 + d.getMinutes(); };
const addDays = (y, n) => { const d = new Date(y + "T12:00:00"); d.setDate(d.getDate() + n); return ymdOf(d); };
const label = y => { const d = new Date(y + "T12:00:00"); return `${d.getMonth() + 1}/${d.getDate()}(${WD[d.getDay()]})`; };
const between = (a, b) => Math.round((new Date(b + "T12:00:00") - new Date(a + "T12:00:00")) / 864e5);
const stamp = iso => iso ? `${label(ymd(iso))} ${hm(iso)}` : "-";
const dur = m => m >= 60 ? `${Math.floor(m / 60)}시간${m % 60 ? " " + (m % 60) + "분" : ""}` : `${m}분`;
const ddayText = (due, today) => { const n = between(today, ymd(due)); return n < 0 ? "지남" : n === 0 ? "오늘" : n === 1 ? "내일" : "D-" + n; };
const relDay = (d, today) => { const n = between(today, d); return n === 0 ? "오늘" : n === 1 ? "내일" : n === 2 ? "모레" : ""; };
const kc = k => `var(--${k || "todo"})`;
const clean = s => String(s || "").replace(/^\[[^\]]+\]\s*/, "");
function findTask(k) {
  if (!k || !D) return null;
  k = String(k).split("#")[0];
  return D.tasks.find(t => t.key === k) || D.someday.find(t => t.key === k) || (D.slotted || []).find(t => t.key === k)
    || (D.semester || []).flatMap(w => w.items).find(t => t.key === k) || null;
}
const links = t => (t && D.links && D.links[t.key]) || [];
const clip = t => { const n = links(t).length;
  return n ? `<span class="clip" ${LIVE ? `data-act="matshow" data-key="${esc(t.key)}"` : MOB ? `data-act="clipnames" data-key="${esc(t.key)}"` : ""} title="연결된 자료: ${esc(links(t).join(", "))}">자료 ${n}</span>` : ""; };
const taskOf = findTask;

// ---- 행동 정의: 종류마다 '주 행동' 하나, 나머지는 ⋯ 안으로
const MOB_OK = new Set(["open", "done", "ignore", "remove", "redo-today", "redo-day", "redo-clear"]);
const redoOf = t => t && D.redo && D.redo[t.key];  // 마감이 지난 일을 하기로 한 날
// 마감이 지났고, 할 날을 정하지 않았거나 정한 날도 지난 일 → 맨 위 줄
const overdueOpen = () => { const today = ymdOf(new Date());
  return D.tasks.filter(t => isLate(t) && !(redoOf(t) && redoOf(t) >= today)); };
const redoTag = t => { const d = redoOf(t); if (!d) return ""; const n = between(ymdOf(new Date()), d);
  return ` · <span class="plan-tag">${n === 0 ? "오늘 하기" : n === 1 ? "내일 하기" : label(d) + " 하기"}</span>`; };
function primaryOf(t) {
  if (!t) return null;
  if (MOB) return t.url && t.kind !== "todo" ? { act: "open", label: t.kind === "assignment" ? "Canvas" : "▶ 열기", icon: "열기", name: "열기" }
                                             : { act: "done", label: "✓ 완료", icon: "✓", name: "완료" };
  if (t.kind === "lecture" && t.url) return { act: "open", label: "▶ 수업 듣기", icon: "듣기", name: "수업 듣기" };
  if (t.kind === "assignment") return { act: "report", label: "✍ 보고서 작성", icon: "작성", name: "보고서 작성" };
  if ((t.kind === "quiz" || t.kind === "review") && t.url) return { act: "open", label: "▶ 퀴즈 풀기", icon: "풀기", name: "퀴즈 풀기" };
  if (t.kind === "todo" && t.due) return { act: "report", label: "✍ 작성", icon: "작성", name: "작성" };
  return { act: "start", label: "⏱ 시작", icon: "시작", name: "시간 재기 시작" };
}
function menuItems(t) {
  const P = primaryOf(t), isActive = D.active && D.active.key === t.key, g = [[], [], [], []], late = [];
  if (isLate(t)) {  // 마감이 지난 일: '지남' 표시는 그대로 두고, 할 날만 정한다
    const today = ymdOf(new Date());
    if (redoOf(t) !== today) late.push({ act: "redo-today", label: "오늘", hint: "지남 표시는 그대로", strong: true });
    late.push({ act: "redo-day", label: "날짜…", hint: redoOf(t) ? label(redoOf(t)) + " 예정" : "날짜 고르기" });
    if (redoOf(t)) late.push({ act: "redo-clear", label: "하기 날짜 취소" });

// 마감 표기 — 지남은 빨강·굵게, 24시간 안은 굵게 (전주의 속성: 색 + 굵기, 둘 다 '급함'에만 쓴다)
function dueMeta(t, now, today) {
  if (!t.due) return t.slot ? `할 시간 ${hm(t.slot[0])}–${hm(t.slot[1])} · 마감 없음` : "";
  const h = (dt(t.due) - now) / 36e5;
  if (h < 0) return `<span class="late">마감 지남 ${label(ymd(t.due))} ${hm(t.due)}</span>`;

// 직접 정한 할 시간이 수업·다른 블록과 겹치면 회색 한 줄로만 알린다 (막지 않음)

const URGENT_MS = 3 * 36e5;  // 이 안에 마감이 있으면 기본 할 일 대신 그 일을 맨 위에
// 기본 할 일: 급한 게 없을 때 맨 위에 이름만 (VSCode 폴더 열기 / 링크 열기). 위 작은 줄에 다음 계획을 알려 준다.
function defaultHero(defs, next, now) {

        ${LIVE ? `<button class="btn plain" data-ui="defmanage">관리</button>` : ""}</div></div></div></section>` };

function hero(rows, now, today) {
  if (D.active) {  // ⏱ 기록 중이면 그게 '지금'
    const a = D.active, t = findTask(a.key);
    return { key: a.key, row: null, html: `<section class="hero" id="hero"><div class="eyebrow">⏱ 기록 중${a.estimate ? ` <span class="sep">·</span> 예상 ${dur(a.estimate)}` : ""}</div>
      <div class="hero-head">${t ? ck(t) : "<span></span>"}<div class="hero-body"><h2 class="hero-title">${esc(a.title)}</h2>
      <div class="timer-num" id="elapsed" role="timer" aria-label="경과 시간">0:00:00</div>
      <div class="hero-acts"><button class="btn primary" data-act="stopdone" data-label="끝내고 완료">✓ 끝내고 완료</button><button class="btn plain" data-act="stop" data-label="멈춤">멈춤</button></div></div></div></section>` };
  }
  const cur = rows.find(r => !r.busy && dt(r.start) <= now && now < dt(r.end));
  const next = rows.find(r => !r.busy && dt(r.start) > now);
  // 순서: 지금 하는 계획 블록 > 3시간 안 마감 > 기본 할 일 (없으면 예전처럼 다음 블록)
  const urgent = cur ? null : D.tasks.filter(x => x.due && dt(x.due) > now && dt(x.due) - now <= URGENT_MS).sort((a, b) => dt(a.due) - dt(b.due))[0];
  const defs = D.defaults || [];
  if (!cur && !urgent && defs.length) return defaultHero(defs, next, now);
  const pick = cur || (urgent ? rows.find(r => r.t && r.t.key === urgent.key && dt(r.end) > now) || null : next);
  let t = urgent && !pick ? urgent : pick && pick.t, eyebrow, progress = "";
  if (urgent && !pick) {
    eyebrow = `마감 <span class="num">${hm(t.due)}</span> <span class="sep">·</span> <span class="soon">${dur(Math.max(1, Math.round((dt(t.due) - now) / 6e4)))} 남음</span>`;
  } else if (t) {
    const left = Math.round((dt(pick.end) - now) / 6e4), until = Math.round((dt(pick.start) - now) / 6e4);
    eyebrow = cur ? `지금 <span class="sep">·</span> <span class="num">${hm(pick.start)}–${hm(pick.end)}</span> <span class="sep">·</span> ${dur(left)} 남음`
                  : `다음 <span class="sep">·</span> <span class="num">${hm(pick.start)}</span> 시작 <span class="sep">·</span> ${dur(until)} 뒤`;
    if (cur) { const pct = Math.min(100, Math.max(2, (now - dt(pick.start)) / (dt(pick.end) - dt(pick.start)) * 100));
      progress = `<div class="bar" role="progressbar" aria-label="이 블록 진행" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(pct)}"><i style="width:${pct.toFixed(1)}%"></i></div>`; }
  } else {
    t = D.tasks.filter(x => dt(x.due) >= now)[0];
    if (!t) return { key: null, row: null, html: `<section class="hero" id="hero"><div class="eyebrow">오늘 남은 계획 없음</div><h2 class="hero-title" style="margin-top:8px">쉬어도 됩니다</h2></section>` };
    eyebrow = `오늘 남은 계획 없음 <span class="sep">·</span> 가장 급한 일`;
  }
  const P = primaryOf(t);
  // 주인공 안에서도 '완료'는 원형 체크 하나로 (A 는 원 + ✓ 완료 버튼 두 개). 그 자리에 자주 쓰는 ⏱ 를 꺼냈다.
  return { key: t.key, row: t && pick && pick.t === t ? pick : null, html: `<section class="hero" id="hero"><div class="eyebrow">${eyebrow}</div>
    <div class="hero-head">${ck(t)}<div class="hero-body">
      <h2 class="hero-title">${esc(t.title)}${pick && pick.part ? ` <span class="clip">(${pick.part})</span>` : ""}</h2>
      <div class="hero-meta">${[KIND[t.kind], t.course && esc(t.course), t.due ? `마감 ${label(ymd(t.due))} ${hm(t.due)} (${ddayText(t.due, today)})` : "마감 없음", links(t).length && `자료 ${links(t).length}`].filter(Boolean).join(" · ")}</div>

    const worked = D.sessionsToday.reduce((s, x) => s + (x.minutes || 0), 0);
    const first = [...D.busy.filter(b => ymd(b.start) === tm), ...D.plan.filter(p => ymd(p.start) === tm)].sort((a, b) => dt(a.start) - dt(b.start))[0];
    li.push(`오늘 끝낸 일 ${D.todayDone.length}${D.todayDone.length ? ": " + D.todayDone.map(t => esc(t.title)).join(", ") : ""}`);
    for (const t of missed) li.push(`계획했지만 안 끝남 · ${esc(t.title)} <button class="tbtn" data-act="done" data-key="${esc(t.key)}" data-label="했음">✓ 했음</button>`);
    if (worked) li.push(`오늘 기록한 시간 ${dur(worked)}`);
    li.push(`내일 ${label(tm)} 첫 일정 ${first ? `${hm(first.start)} ${esc(first.label || clean(first.summary))}` : "없음"}`);
  } else {
    const cls = D.busy.filter(b => ymd(b.start) === today), m = todayPlan.reduce((s, p) => s + (dt(p.end) - dt(p.start)) / 6e4, 0);
    li.push(`수업·약속 ${cls.length}개${cls.length ? " (" + cls.map(b => `${hm(b.start)} ${esc(b.label)}`).join(", ") + ")" : ""}`);
    li.push(`계획된 할 일 ${todayPlan.length}개 · ${dur(Math.round(m))}${todayPlan[0] ? ` · 첫 블록 ${hm(todayPlan[0].start)}` : ""}`);
    const rest = D.plan.filter(p => p.why && p.why.includes("다른 요일") && dt(p.end) > now);
    if (rest.length) li.push(`쉬려던 요일에 잡힌 것 ${rest.length}개 (마감 때문에): ${rest.map(p => `${label(ymd(p.start))} ${esc(clean(p.summary))}`).join(", ")}`);
    const soon2 = D.tasks.filter(t => dt(t.due) >= now && between(today, ymd(t.due)) <= 2);
    if (soon2.length) li.push(`이틀 안 마감 ${soon2.length}개`);
  }
  if (D.quiz && D.quiz.stale) li.push(`퀴즈 기록을 ${D.quiz.backupAt ? label(ymd(D.quiz.backupAt)) + " 이후로" : "아직"} 가져오지 않았어요 — 퀴즈 앱에서 [기록 내보내기] <button class="tbtn" data-act="openquiz" data-label="퀴즈 앱 열기">퀴즈 앱 열기</button>`);
  if (evening && now.getDay() === 0 && D.weekReview) li.push(`이번 주 돌아보기 — 아래 '통계'에 있음`);
  G.push(`<div class="cgrp"><h3 class="cgrp-h">${evening ? "하루 마무리" : "오늘 브리핑"}<button class="tbtn gray" data-act="ritualclose" data-label="${evening ? "마무리" : "오늘 시작"}">${evening ? "마무리" : "오늘 시작"}</button></h3>
    <ul class="clist">${li.map(x => `<li>${x}</li>`).join("")}</ul>
    ${D.recent.length ? `<h3 class="cgrp-h" style="margin-top:12px">지난 하루 동안 바뀐 것 ${D.recent.length}</h3><ul class="clist">${D.recent.map(r => `<li>${esc(String(r.label).replace(/^\S+\s/, ""))} · ${esc(r.name)}</li>`).join("")}</ul>` : ""}</div>`);
  hint.push(evening ? "하루 마무리" : "오늘 브리핑");
  return `<details class="check" data-k="check" ${det("check")}><summary><span class="cnt num" aria-label="${n}개">${n}</span>
    <span class="ttl">확인할 것</span><span class="hint">${hint.join(" · ")}</span><span class="chev">›</span></summary>
    <div class="check-body">${G.join("")}</div></details>`;
}

// ---- 다가오는 마감: 3일만, 나머지는 '2주 보기'
function duesHtml(now, today) {
  const open = D.tasks.filter(t => dt(t.due) >= now), top = new Set(overdueOpen().map(t => t.key)),
        late = D.tasks.filter(t => dt(t.due) < now && !((LIVE || MOB) && top.has(t.key)));
  const span = UI.allDues ? 14 : 4;  // 오늘 + 3일
  const hidden = open.filter(t => between(today, ymd(t.due)) >= span && between(today, ymd(t.due)) < 14).length;
  // 오늘 타임라인에 잡힌 일은 '오늘 HH:MM 계획' 꼬리표로 이어 준다 (같은 일이라는 걸 색으로 묶음 — 게슈탈트 유사성)
  const planned = t => D.plan.find(p => p.key === t.key && ymd(p.start) === today && dt(p.end) > now);
  const row = (t, lateRow) => { const pl = planned(t);
    return `<div class="row nt${lateRow ? " is-late" : ""}"${rowAttr(t)}>${ck(t)}<div class="body"><div class="ttl">${esc(t.title)}${clip(t)}</div>
    <div class="meta">${lateRow ? `<span class="late">${label(ymd(t.due))} ${hm(t.due)} 지남</span>${redoTag(t)}` : (dt(t.due) - now) < 864e5 ? `<span class="soon num">${hm(t.due)} · ${Math.max(1, Math.round((dt(t.due) - now) / 36e5))}시간 남음</span>` : `<span class="num">${hm(t.due)}</span>`}${t.course ? " · " + esc(t.course) : ""} · ${KIND[t.kind]}${pl ? ` · <span class="plan-tag">오늘 ${hm(pl.start)} 계획</span>` : ""}</div></div>${lateRow && !redoOf(t) && (LIVE || MOB) ? lateActs(t) : rowActs(t)}</div>`; };
  let h = `<section class="sec"><div class="sec-h"><h2>다가오는 마감</h2><span class="aside">${UI.allDues ? "2주" : "앞으로 3일"}</span>
    <button class="link" data-ui="alldues" aria-expanded="${UI.allDues}">${UI.allDues ? "3일만 보기" : hidden ? `2주 보기 (+${hidden})` : "2주 보기"}</button></div><div class="rows">`;
  if (late.length) h += `<div class="day-h danger" id="late">마감 지남 ${late.length} <span class="d">할 날을 정한 것 · 끝냈으면 ○</span></div>` + late.map(t => row(t, true)).join("");
  let any = false;
  for (let i = 0; i < span; i++) {
    const d = addDays(today, i), all = open.filter(t => ymd(t.due) === d), its = all.filter(t => t.key !== HERO_KEY);
    if (!all.length) continue;
    any = true;
    h += `<div class="day-h ${i === 0 ? "today" : ""}">${relDay(d, today) || "D-" + i} <span class="d">${label(d)} · ${all.length}개${its.length < all.length ? " (1개는 위 '지금')" : ""}</span></div>` + its.map(t => row(t)).join("");
  }
  if (!any && !late.length) h += `<p class="empty">${UI.allDues ? "2주" : "3일"} 안 마감 없음</p>`;
  return h + `</div></section>`;
}

// ---- 주차별 (간단히: 날짜별 목록)
function curWeekIdx(today) {
  const ws = D.semester || [];
  const i = ws.findIndex(w => w.start <= today && today <= addDays(w.start, 6));
  return i >= 0 ? i : (ws.length && today < ws[0].start ? 0 : ws.length - 1);
}
function weekView(now, today) {
  const ws = D.semester || [];
  if (!ws.length) return `<p class="empty">학기 정보가 없습니다.</p>`;
  const cur = curWeekIdx(today), i = wkIdx === null ? cur : Math.max(0, Math.min(ws.length - 1, wkIdx));
  const w = ws[i], days = [...Array(7)].map((_, k) => addDays(w.start, k)), maxMin = Math.max(60, ...ws.map(x => x.minutes));
  HERO_KEY = null;
  let h = critHtml(now) + `<section class="hero" style="margin-top:32px"><div class="wk-nav"><button class="icon-btn" data-wk="${i - 1}" ${i === 0 ? "disabled" : ""} aria-label="이전 주">‹</button>
    <b>${i + 1}주차</b><span class="r num">${label(w.start)} – ${label(days[6])}</span><button class="icon-btn" data-wk="${i + 1}" ${i === ws.length - 1 ? "disabled" : ""} aria-label="다음 주">›</button>
    ${i !== cur ? `<button class="link push" data-wk="${cur}">이번 주로</button>` : `<span class="r push">이번 주</span>`}</div>
    <div class="strip">${ws.map((x, j) => `<button class="sw ${j === i ? "sel" : ""} ${j === cur ? "cur" : ""} ${j < cur ? "past" : ""} ${x.items.some(y => y.exam) ? "ex" : ""}" data-wk="${j}"
      title="${j + 1}주차 · 마감 ${x.items.length}개 · 남은 일 ${dur(x.minutes)}"><em></em><i style="height:${Math.max(3, Math.round(x.minutes / maxMin * 32))}px"></i><span>${j + 1}</span></button>`).join("")}</div>
    <p class="strip-note">막대 = 그 주에 남은 일의 양 · 빨간 점 = 시험</p></section>`;

  h += `<section class="sec"><div class="sec-h"><h2>날짜별 일정</h2><span class="aside">계획은 2주 앞까지</span></div><div class="rows">`;
  for (const d of days) {
    const items = [...D.busy.filter(b => ymd(b.start) === d).map(b => ({ busy: true, ...b })), ...D.plan.filter(p => ymd(p.start) === d)].sort((a, b) => dt(a.start) - dt(b.start));
    const rd = relDay(d, today), dd = new Date(d + "T12:00:00");
    h += `<div class="day-h ${d === today ? "today" : ""}">${WD[dd.getDay()]}요일${rd ? " · " + rd : ""} <span class="d">${label(d)}${items.length ? "" : " · 일정 없음"}</span></div>`;
    for (const p of items) {
      const past = dt(p.end) <= now ? " past" : "", curC = dt(p.start) <= now && now < dt(p.end) ? " cur" : "";
      const tcol = `<span class="t num">${hm(p.start)}<small>${hm(p.end)}</small></span>`;
      if (p.busy) { h += `<div class="row busy${past}">${tcol}<span class="bmark"></span><div class="body"><div class="ttl">${esc(p.label)}</div></div><span></span></div>`; continue; }
      const t = findTask(p.key);
      h += `<div class="row${past}${curC}"${past ? "" : rowAttr(t)}>${tcol}${t ? ck(t) : "<span></span>"}<div class="body" title="${esc(p.why || "")}"><div class="ttl">${esc(t ? t.title : clean(p.summary))}${clip(t)}</div>
        <div class="meta">${t ? [KIND[t.kind], t.course && esc(t.course), "마감 " + ddayText(t.due, today)].filter(Boolean).join(" · ") : ""}</div></div>${t && !past ? rowActs(t) : "<span></span>"}</div>`;
    }
  }
  h += `</div></section>`;

  const its = w.items, openIts = its.filter(x => x.status === "open"), doneIts = its.filter(x => x.status === "done");
  h += `<section class="sec"><div class="sec-h"><h2>이 주에 마감</h2><span class="aside">${openIts.length}개 남음 / 전체 ${its.length}개</span></div><div class="rows">`;
  for (const [kind, name] of [["lecture", "강의"], ["assignment", "과제"], ["quiz", "퀴즈"], ["review", "퀴즈 복습"], ["todo", "할 일"]]) {
    const g = openIts.filter(x => x.kind === kind).sort((a, b) => dt(a.due) - dt(b.due));
    if (!g.length) continue;
    h += `<div class="day-h">${name} <span class="d">${g.length}</span></div>` + g.map(x => {
      const late = dt(x.due) < now;
      return `<div class="row nt"${rowAttr(x)}>${ck(x)}<div class="body"><div class="ttl">${x.exam ? "시험 · " : ""}${esc(x.title)}${clip(x)}</div>
        <div class="meta">${x.course ? esc(x.course) + " · " : ""}마감 ${label(ymd(x.due))} ${hm(x.due)} · ${late ? `<span class="late">지남</span>` : ddayText(x.due, today)}${x.minutes ? " · 예상 " + dur(x.minutes) : ""}</div></div>${rowActs(x)}</div>`;
    }).join("");
  }
  if (!its.length) h += `<p class="empty">이 주에 마감인 것이 없습니다.</p>`;
  if (doneIts.length) h += `<details data-k="wkdone" ${det("wkdone")} style="margin-top:8px"><summary class="small"><span class="chev">›</span> 끝낸 것 ${doneIts.length}개</summary>
    <div class="done-l" style="padding-left:20px">${doneIts.map(x => `<div>${esc(x.title)}</div>`).join("")}</div></details>`;
  return h + `</div></section>`;
}

    ${rd.map(t => `<div class="citem"><span class="tx">${esc(t.title)}<small>${[t.course && esc(t.course), KIND[t.kind], "끝냄 " + stamp(t.doneAt)].filter(Boolean).join(" · ")}</small></span>
      ${LIVE || MOB ? `<span class="ac"><button class="tbtn" data-act="revive" data-key="${esc(t.key)}" data-title="${esc(t.title)}" title="완료를 취소하고 다시 할 일로">되살리기</button></span>` : ""}</div>`).join("")}
    <p class="small">Canvas 에 이미 제출한 과제는 다음 Canvas 확인 때 다시 '완료'가 됩니다 (제출을 취소했다면 그대로 남음).</p></div></details>`;
  h += `<details data-k="stats" ${det("stats")}><summary><span class="ttl">통계</span><span class="hint">학습량 · 과목별 진행 · 완료 추이 · 걸린 시간 · 돌아보기</span><span class="chev">›</span></summary><div class="inner">${statsHtml(today)}</div></details>`;
  return h;
}

// 한 일 기록: 무엇을 · 얼마나 (직접 적기) + ⏱ 로 잰 것, 날짜별로 묶어 합계
function worklogHtml(today) {

  const todayMin = W.filter(w => w.day === today).reduce((s, w) => s + w.minutes, 0);

    ${form}${list || `<p class="empty">아직 없음 — 무엇을 했고 얼마나 걸렸는지 적으면 날짜별로 쌓입니다</p>`}</div></details>`;

// "90", "90분", "1시간", "1시간 30분", "1.5h", "2h 10m" → 분
function parseMinutes(s) {
  s = String(s).trim().toLowerCase();
  if (/^\d+$/.test(s)) return +s;
  const h = s.match(/([\d.]+)\s*(시간|h)/), m = s.match(/(\d+)\s*(분|m(?!s))/);
  const v = Math.round((h ? parseFloat(h[1]) * 60 : 0) + (m ? +m[1] : 0));
  return v || NaN;
}
function statsHtml(today) {
  const days14 = [...Array(14)].map((_, i) => addDays(today, i));
  const planMin = d => D.plan.filter(p => ymd(p.start) === d).reduce((s, p) => s + mins(p.end) - mins(p.start), 0);
  const maxLoad = Math.max(D.cap, ...days14.map(planMin));
  const tick = (d, i) => i % 2 ? "&nbsp;" : `${+d.slice(5, 7)}/${+d.slice(8)}`;
  const load = `<div class="bars"><div class="cap" style="bottom:${D.cap / maxLoad * 100}%" title="하루 한도 ${dur(D.cap)}"></div>${days14.map((d, i) => { const m = planMin(d);
    return `<div class="b ${m > D.cap ? "over" : ""}" title="${label(d)} ${dur(m)}"><i style="height:${m / maxLoad * 100}%"></i><span>${tick(d, i)}</span></div>`; }).join("")}</div>`;
  const past14 = [...Array(14)].map((_, i) => addDays(today, i - 13)), maxDone = Math.max(1, ...past14.map(d => D.doneByDay[d] || 0));
  const trend = `<div class="bars">${past14.map((d, i) => `<div class="b" title="${label(d)} ${D.doneByDay[d] || 0}건"><i style="height:${(D.doneByDay[d] || 0) / maxDone * 100}%"></i><span>${tick(d, i)}</span></div>`).join("")}</div>`;
  const prog = D.progress.map(p => `<div class="prog"><div class="r"><span>${esc(p.course)}</span><span class="num">${p.done}/${p.total}</span></div><div class="tr"><i style="width:${p.total ? p.done / p.total * 100 : 0}%"></i></div></div>`).join("") || `<p class="empty">아직 없음</p>`;
  const ses = D.sessionsToday.length ? D.sessionsToday.map(s => { const t = findTask(s.key); return `<div class="citem"><span class="tx">${hm(s.start)}${s.end ? "–" + hm(s.end) : " (진행 중)"} ${esc(t ? t.title : s.key)}</span><span class="small">${s.minutes ? dur(s.minutes) : ""}</span></div>`; }).join("")
    : `<p class="small">⏱ 시간 재기로 기록하면 여기에 쌓이고, 쌓인 기록으로 예상 시간을 고칩니다.</p>`;
  const cal = (D.calibration || []).length ? D.calibration.map(c => `<div class="citem"><span class="tx">${esc(c.what)}</span><span class="small">예상의 ×${c.factor} (${c.n}번)</span></div>`).join("")
    : `<p class="small">같은 종류가 3번 기록되면 계획에 반영됩니다.</p>`;
  const q = D.quiz || {};
  const quiz = `<p class="small" style="margin:0">마지막으로 가져온 기록: ${q.backupAt ? stamp(q.backupAt) : "없음"}${q.stale ? " (오래됨)" : ""}</p>${Object.entries(q.dueBySubject || {}).map(([s, n]) => `<div class="citem"><span class="tx">${esc(s)}</span><span class="small">복습 ${n}</span></div>`).join("")}
    <button class="tbtn" data-act="openquiz" data-label="퀴즈 앱 열기" style="padding-left:0">퀴즈 앱 열기</button>`;
  const W = D.weekReview;
  const wr = W ? `<ul class="clist"><li>끝낸 일 <b>${W.doneTotal}</b>${W.doneTotal ? " (" + Object.entries(W.done).map(([k, n]) => `${KIND[k] || k} ${n}`).join(", ") + ")" : ""}</li>
    <li>기록 ${W.trackedCount ? `${W.trackedCount}번 · 실제 ${dur(W.trackedMinutes)} / 예상 ${dur(W.trackedEstimate)}` : "없음"}</li>
    <li>${W.missed.length ? `놓친 마감 ${W.missed.length}: ${W.missed.map(m => esc(m.title)).join(", ")}` : "놓친 마감 없음"}</li>
    <li>다음 주 마감 ${W.nextCount}개 · 예상 ${dur(W.nextMinutes)}${W.nextExams.length ? " · 시험 " + W.nextExams.map(esc).join(", ") : ""}</li></ul>` : `<p class="empty">아직 없음</p>`;
  const S = (t, s, b) => `<div class="stat"><h3>${t} <small>${s}</small></h3>${b}</div>`;
  return `<div class="stats">${S("일별 학습량", "계획 · 점선 = 하루 한도", load)}${S("완료 추이", "14일", trend)}${S("과목별 진행", "추적한 항목 중 완료", prog)}
    ${S("이번 주 돌아보기", "월요일부터", wr)}${S("오늘 실제로 한 시간", "기록", ses)}${S("예상 시간 보정", "기록 3번 이상부터", cal)}${S("퀴즈 복습", "기록 내보내기 기준", quiz)}</div>`;
}

// ---- ⋯ 메뉴 (열면 첫 항목에 포커스, ↑↓ 로 이동, 닫으면 누른 버튼으로 포커스가 돌아간다)
function openMenu(btn, key) {
  const t = findTask(key), m = $("menu");
  if (!t) return;
  closeMenu(false);
  UI.menuKey = key; UI.menuFrom = btn;
  btn.setAttribute("aria-expanded", "true");
  fillMenu(t);
  m.hidden = false;
  const r = btn.getBoundingClientRect(), W = m.offsetWidth, H = m.offsetHeight;
  let left = Math.min(window.innerWidth - W - 16, Math.max(16, r.right - W)), top = r.bottom + 4;
  if (top + H > window.innerHeight - 16) top = Math.max(16, r.top - H - 4);
  m.style.left = left + "px"; m.style.top = top + "px";
  m.querySelector("button").focus({ preventScroll: true });
}
function fillMenu(t) {
  $("menu").setAttribute("aria-label", t.title);
  $("menu").innerHTML = `<div class="mh" aria-hidden="true">${esc(t.title)}</div>` + menuItems(t).map(g => g.map(x =>
    `<button role="menuitem" class="${x.strong ? "strong" : ""} ${x.danger ? "danger" : ""}" data-act="${x.act}" data-key="${esc(t.key)}" data-label="${esc(x.label)}">${esc(x.label)}${x.hint ? `<small>${esc(x.hint)}</small>` : ""}</button>`).join("")).join(`<hr aria-hidden="true">`);
}
function closeMenu(restore = true) {
  const m = $("menu"), from = UI.menuFrom;
  if (m.hidden) return;
  const had = m.contains(document.activeElement);
  m.hidden = true; UI.menuKey = null; UI.menuFrom = null;
  if (from) { from.setAttribute("aria-expanded", "false"); if (restore && had && document.contains(from)) from.focus({ preventScroll: true }); }
}
function ignoreMenu(key) {  // 제외: 이것만(되돌리기 가능 → 바로) / 앞으로도(규칙이 남음 → 확인 창)
  const t = findTask(key);
  $("menu").innerHTML = `<div class="mh" aria-hidden="true">제외 — ${esc(t ? t.title : "")}</div>
    <button role="menuitem" data-act="ign-one" data-key="${esc(key)}" data-label="이것만 제외">이것만<small>이 과제 하나 · 되돌리기 가능</small></button>
    <button role="menuitem" data-act="ign-all" data-key="${esc(key)}" data-label="앞으로도 제외">앞으로도…<small>같은 이름 계속 · 확인 후</small></button><hr aria-hidden="true">
    <button role="menuitem" data-menu="${esc(key)}">취소</button>`;
  $("menu").querySelector("button").focus({ preventScroll: true });
}

// ---- 시트 (보고서 작성 창 · 자료 창 · 확인 · 행동 · 단축키): 위에 뜨고, 포커스를 가두고, 닫으면 원래 자리로
function openSheet(html) {
  if ($("scrim").hidden) UI.sheetFrom = document.activeElement;
  $("sheet").classList.remove("wide");
  $("sheet").innerHTML = html; $("scrim").hidden = false;
  ($("sheet").querySelector("[data-autofocus]") || $("sheet").querySelector("button,textarea,input"))?.focus({ preventScroll: true });
}
function closeSheet() {
  if ($("scrim").hidden) return;
  $("scrim").hidden = true; $("sheet").classList.remove("wide"); MP = null; REP = null;
  const f = UI.sheetFrom; UI.sheetFrom = null;
  if (f && document.contains(f)) f.focus({ preventScroll: true });
}
const sheetTop = (title, sub) => `<div class="sh-top"><h3 id="sheetTitle">${esc(title)}</h3><button class="icon-btn" data-ui="sheetclose" aria-label="닫기">✕</button></div>${sub ? `<p class="small" style="margin:4px 0 0">${sub}</p>` : ""}`;
// ---- 보고서 창 · 자료 창: 시트 안에 (예전과 같은 기능 — 아래 코드는 예전 화면에서 그대로)
async function openPanel(kind, key, opts) {
  closeMenu(false);
  if ($("scrim").hidden || !$("matPanel")) { openSheet(`<div class="panel"><div id="repPanel"></div><div id="matPanel"></div></div>`); MP = null; REP = null; }
  $("sheet").classList.add("wide");
  if (kind === "report") await showReport(key); else await showMaterials(key, opts || {});
  if (kind !== "report" && !$("repPanel").innerHTML) $("matPanel").querySelector("h2")?.insertAdjacentHTML("beforeend", `<button class="icon-btn" data-ui="sheetclose" aria-label="닫기" style="margin-left:auto">✕</button>`);
}
// ---- 📄 자료 창: 연결된 자료(칩) · 추천 · 실시간 찾기(/ 경로 + Tab) · 📁 둘러보기 · 📥 최근 다운로드
// 찾기는 화면 안에서 한다 — 파일 '이름' 목록을 1분에 한 번 받아 두고 글자를 칠 때마다 여기서 거름 (디스크·서버 0).
// 범위·개수 같은 규칙은 config/materials.yaml (바꾸려면 채팅에서).
let MP = null;  // 열린 자료 창의 상태
const FILES = { at: 0, list: [], roots: [] };
async function getJSON(url) {
  const r = await fetch(url, { cache: "no-store" }), j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || "실패");
  return j;
}
async function fileIndex() {
  if (Date.now() - FILES.at > 60000) { const j = await getJSON("/api/files"); Object.assign(FILES, { at: Date.now(), list: j.files, roots: j.roots }); }
  return FILES.list;
}
const full = f => f.r + "/" + f.rel;
const fdate = m => { const d = new Date(m * 1000); return `${d.getMonth() + 1}/${d.getDate()}`; };
function hl(s, words) {  // 맞은 글자 굵게 (escape 하면서)
  const low = s.toLowerCase(), on = new Array(s.length).fill(false);
  for (const w of words) for (let i = w ? low.indexOf(w) : -1; i >= 0; i = low.indexOf(w, i + w.length)) on.fill(true, i, i + w.length);
  let out = "", b = false;
  for (let i = 0; i < s.length; i++) { if (on[i] !== b) { out += on[i] ? "<b>" : "</b>"; b = on[i]; } out += esc(s[i]); }
  return out + (b ? "</b>" : "");
}
function mpMsg(text) { const el = $("mpMsg"); if (el) { el.className = "msg err"; el.textContent = text || ""; } }

// 단어 찾기: 모든 단어가 경로에 있어야. 파일 이름에서 맞음 > 경로에서만 · 단어 앞부분 · 이 과목 폴더 · 최근 파일 가산
function mpSearch(q) {
  const words = q.toLowerCase().split(/\s+/).filter(Boolean), nowS = Date.now() / 1000, out = [];
  for (const f of [...FILES.list, ...(MP.dl || [])]) {
    const path = full(f).toLowerCase(), name = path.slice(path.lastIndexOf("/") + 1);
    let sc = 0;
    for (const w of words) {
      const i = name.indexOf(w);
      if (i >= 0) sc += 10 + (i === 0 || /[\s_\-\[(.·]/.test(name[i - 1]) ? 4 : 0);
      else if (path.includes(w)) sc += 3;
      else { sc = -1; break; }
    }
    if (sc < 0) continue;
    if (MP.scope.some(s => full(f).startsWith(s + "/"))) sc += 5;
    sc += Math.max(0, 3 - (nowS - f.m) / 86400 / 7);
    out.push([sc, f]);
  }
  return out.sort((a, b) => b[0] - a[0]).map(x => ({ f: x[1], dir: false, name: full(x[1]) }));
}
// 경로 모드 ('/' 가 있으면): 그 폴더 바로 아래의 폴더·파일만
function mpSplit(q) { q = q.replace(/^\/+/, ""); const cut = q.lastIndexOf("/"); return [cut >= 0 ? q.slice(0, cut) : "", q.slice(cut + 1)]; }
function mpPath(q) {
  const [dir, part] = mpSplit(q), low = part.toLowerCase(), list = [...FILES.list, ...(MP.dl || [])], kids = new Map();
  if (!dir) for (const r of [...FILES.roots, ...(MP.dl ? ["다운로드"] : [])]) kids.set(r, { name: r, dir: true, count: list.filter(f => f.r === r).length });
  else for (const f of list) {
    const p = full(f);
    if (!p.startsWith(dir + "/")) continue;
    const rest = p.slice(dir.length + 1), i = rest.indexOf("/");
    if (i < 0) { kids.set(rest, { name: rest, dir: false, f }); continue; }
    const k = kids.get(rest.slice(0, i)) || { name: rest.slice(0, i), dir: true, count: 0 };
    k.count++; kids.set(k.name, k);
  }
  return [...kids.values()].filter(k => k.name.toLowerCase().includes(low))
    .sort((a, b) => (b.name.toLowerCase().startsWith(low) - a.name.toLowerCase().startsWith(low)) || (b.dir - a.dir) || a.name.localeCompare(b.name, "ko"))
    .map(k => ({ ...k, path: (dir ? dir + "/" : "") + k.name }));
}
function mpResults() {
  const inp = $("mpQ"), box = $("mpRes");
  if (!inp || !MP) return;
  const q = inp.value;
  if (!q.trim()) { MP.items = []; box.innerHTML = ""; return; }
  if (!FILES.at) { box.innerHTML = `<p class="hint">파일 목록 읽는 중…</p>`; return; }
  const pathMode = q.includes("/"), items = MP.items = pathMode ? mpPath(q) : mpSearch(q);
  MP.sel = Math.max(0, Math.min(MP.sel, items.length - 1));
  const words = pathMode ? [mpSplit(q)[1].toLowerCase()] : q.toLowerCase().split(/\s+/).filter(Boolean);
  const have = new Set(MP.links.map(x => x.p)), shown = items.slice(0, MP.limit);
  box.innerHTML = items.length ? shown.map((k, i) => {
    const on = i === MP.sel ? " on" : "";
    if (k.dir) return `<div class="mrow${on}" data-mi="${i}"><span class="p">📁 ${hl(k.name, words)} <small>${k.count}개</small></span>
      <span class="acts"><button data-act="mpin" data-i="${i}">들어가기</button></span></div>`;
    const f = k.f, dl = f.r === "다운로드";
    return `<div class="mrow${on}" data-mi="${i}"><span class="p">${dl ? "📥" : "📄"} ${hl(k.name, words)} <small>${fdate(f.m)}</small></span>
      <span class="acts"><button data-act="openfile" data-path="${esc(f.p)}">열어보기</button>${have.has(f.p) ? `<span class="meta">연결됨</span>`
        : `<button data-act="mplink" data-i="${i}">${dl ? "옮겨서 연결" : "+ 연결"}</button>`}</span></div>`;
  }).join("") + (items.length > shown.length ? `<button class="chip" data-act="mpmore">외 ${items.length - shown.length}개 더 보기</button>` : "")
    : `<p class="empty">맞는 파일 없음${MP.dl ? "" : " — 📥 다운로드에서도 찾기를 켜 보거나, 찾기 범위 밖이면 채팅에서 범위 추가를 요청하세요"}</p>`;
  const cur = box.querySelector(".mrow.on");
  if (cur) cur.scrollIntoView({ block: "nearest" });
}
function mpKey(e) {
  const inp = e.target, items = MP.items || [];
  if (e.key === "Escape") { e.preventDefault(); if (inp.value) { inp.value = ""; mpResults(); } else { closeSheet(); } return; }
  if (!items.length) return;
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    MP.sel = (MP.sel + (e.key === "ArrowDown" ? 1 : -1) + Math.min(items.length, MP.limit)) % Math.min(items.length, MP.limit);
    return mpResults();
  }
  if (e.key === "Tab") {  // 채우기: 경로 모드면 공통 앞부분까지 → 고른 것 (폴더면 '/' 붙여 한 단계 들어감)
    e.preventDefault();
    const k = items[MP.sel];
    if (inp.value.includes("/")) {
      const [dir, part] = mpSplit(inp.value);
      let pre = items[0].name;
      for (const x of items) while (!x.name.startsWith(pre)) pre = pre.slice(0, -1);
      inp.value = items.length > 1 && pre.length > part.length ? (dir ? dir + "/" : "") + pre : k.path + (k.dir ? "/" : "");
    } else inp.value = full(k.f);
    MP.sel = 0;
    return mpResults();
  }
  if (e.key === "Enter") {
    e.preventDefault();
    const k = items[MP.sel];
    if (k.dir) { inp.value = k.path + "/"; MP.sel = 0; return mpResults(); }
    mpLink([k.f]);
  }
}

function mpDraw() {
  const live = MP.links.filter(x => x.exists).length;
  const chips = MP.links.map(x => x.exists
    ? `<span class="lchip" title="${esc(full(x))}${x.origin === "pair" ? " · 강의 플랫폼에서 같은 주차의 자료라 자동으로 연결됨" : ""}"><button data-act="openfile" data-path="${esc(x.p)}">${x.origin === "pair" ? "🔗" : "📄"} ${esc(x.name)}</button>${
        x.pdf ? (x.summary ? `<button data-act="openfile" data-path="${esc(x.summary)}" title="만들어 둔 요약 열기">📝</button>`
                           : `<button data-act="summarize" data-path="${esc(x.p)}" title="🤖 이 PDF 의 핵심 정리 만들기 (${AI()} 사용, 몇 분)">🤖</button>`) : ""}<button data-act="unlink" data-path="${esc(x.p)}" title="연결 빼기">✕</button></span>`
    : `<span class="lchip miss" title="${esc(x.p)}">⚠️ ${esc(x.name)} <i>파일 없음</i><button data-act="refind" data-name="${esc(x.name)}" title="같은 이름으로 다시 찾기">다시 찾기</button><button data-act="unlink" data-path="${esc(x.p)}" title="연결 빼기">✕</button></span>`).join("");
  $("mpTop").innerHTML = `<div class="meta">연결된 자료 ${live}/${MP.max}${MP.links.length ? " · 누르면 열림 · ✍ 보고서·🤖 내용정리가 이것만 참고" : " — 아직 없음. 고르면 ✍ 보고서·🤖 내용정리가 이것을 참고 (없으면 제목으로 추측)"}</div>
    ${MP.links.length ? `<div class="lchips">${chips}</div>` : ""}
    ${MP.suggest.length ? `<div class="meta">추천 <span class="hint">⭐ 제목 번호가 맞음 · 누르면 연결</span></div><div class="lchips">${MP.suggest.map(s =>
      `<button class="chip" data-act="mplinkp" data-path="${esc(s.p)}" title="${esc(s.why)}">${s.why.startsWith("번호") ? "⭐ " : ""}+ ${esc(s.name)}</button>`).join("")}</div>` : ""}
    ${MP.note ? `<p class="msg">${esc(MP.note)}</p>` : ""}`;
  $("mpDays").textContent = MP.days;
  $("mpFoot").innerHTML = `${MP.deleted.length ? `<p class="hint" title="${esc(MP.deleted.join("\n"))}">이 과목에서 교수님이 지운 자료 ${MP.deleted.length}개는 받지 않았습니다 (마우스를 올리면 목록).</p>` : ""}
    <div class="frow" style="margin-top:6px"><button class="chip" data-act="quizcopy" data-key="${esc(MP.key)}" title="채팅에 붙여 넣으면 연결된 자료로 퀴즈를 만듭니다 (퀴즈 프로젝트 규칙: 계획서 → 승인 → 제작)">🧩 퀴즈 요청 복사</button>
      <span class="hint">찾기: 단어 몇 개 · <code>/</code> 로 폴더 (예: 자료/) · <kbd>↑↓</kbd> 고르기 · <kbd>Tab</kbd> 채우기 · <kbd>Enter</kbd> 연결 · <kbd>Esc</kbd> 지우기·닫기</span></div>`;
  if (MP.browse) mpBrowseList();
}

async function showMaterials(key, opts = {}) {
  const j = await getJSON("/api/links?key=" + encodeURIComponent(key));
  const fresh = !MP || MP.key !== key || !$("mpQ");
  if (fresh) {
    MP = { key, sel: 0, limit: 8, dl: null, browse: null, items: [], note: "" };
    $("matPanel").innerHTML = `<div class="card mat"><h2>📄 <span id="mpTitle"></span>
        </h2>
      <div id="mpTop"></div>
      <div class="msearch"><input id="mpQ" type="text" autocomplete="off" spellcheck="false" placeholder="자료 찾기 — 예) 17강 배포   ·   자료/ 처럼 / 로 폴더 따라가기">
        <button data-act="mpbrowse" title="폴더를 눌러 다니며 여러 개 고르기">📁 둘러보기</button>
        <label class="hint" title="다운로드 폴더에서 최근에 받은 문서도 찾기 — 연결하면 이 할 일의 과목 폴더로 옮겨짐"><input type="checkbox" id="mpDl"> 📥 다운로드에서도 찾기 (최근 <span id="mpDays"></span>일)</label></div>
      <div id="mpMsg" class="msg"></div><div id="mpRes" class="mres"></div><div id="mpBrowse"></div><div id="mpFoot"></div></div>`;
    $("mpQ").addEventListener("input", () => { MP.sel = 0; MP.limit = 8; mpResults(); });

    $("mpDl").addEventListener("change", async e => {

// 연결: 일반 파일은 한 번에, 다운로드 파일은 과목 폴더로 옮긴 뒤 하나씩
async function mpLink(fs) {
  mpMsg("");
  try {
    const plain = fs.filter(f => f.r !== "다운로드").map(f => f.p);
    if (plain.length) await api("link", { key: MP.key, paths: plain });
    for (const f of fs.filter(f => f.r === "다운로드")) {
      let r = await api("link-download", { key: MP.key, path: f.p });
      if (r.needCourse) {
        const c = prompt(`이 할 일의 과목을 몰라서, 어느 과목 폴더로 옮길지 정해 주세요.\n과목: ${r.courses.join(", ")}`);
        if (!c) continue;
        r = await api("link-download", { key: MP.key, path: f.p, course: c.trim() });
        if (r.needCourse) throw new Error("그 과목을 찾지 못했습니다: " + c);
      }
      MP.note = r.message || "";
      if (MP.dl) MP.dl = MP.dl.filter(x => x.p !== f.p);
      FILES.at = 0;
    }
    if (MP.browse) MP.browse.checked.clear();
    $("mpQ").value = "";
  } catch (err) { mpMsg(err.message); }
  if (FILES.at === 0) await fileIndex().catch(() => {});
  await showMaterials(MP.key);
  if (MP.browse) await mpBrowse(MP.browse.root, MP.browse.path);
  load();
}

function mpBrowseList() {

async function copyText(text) {  // 클립보드 → 안 되면 옛 방식 → 그래도 안 되면 보여 주고 직접 복사
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; } catch {}
  if (!ok) {
    const ta = Object.assign(document.createElement("textarea"), { value: text });
    document.body.appendChild(ta); ta.select();
    try { ok = document.execCommand("copy"); } catch {}
    ta.remove();
  }
  if (!ok) prompt("복사해서 채팅에 붙여 넣으세요", text);
  return ok;
}

// ---- 알림 띠 (되돌리기 단추를 붙일 수 있다 — 닐슨 3 사용자 통제)
function toast(text, undo, ms, extra) {
  const el = $("toast");
  toast.undo = typeof undo === "function" ? undo : null;
  el.innerHTML = `<span>${esc(text)}</span>${toast.undo ? `<button data-act="undo">되돌리기</button>` : ""}${extra || ""}`;
  el.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => { el.hidden = true; }, ms || (toast.undo || extra ? 8000 : 3000));
}
async function run(fn, okMsg) {  // 실패하면 알림 띠에 이유
  try { const r = await fn(); if (okMsg) toast(typeof okMsg === "function" ? okMsg(r) : okMsg); return r; }
  catch (err) { toast(err.message || "실패", null, 6000); if (D) render(); }  // 바로 지운 줄을 되살린다
}

// 자료 창·보고서 창 안의 버튼 (예전 화면과 같은 동작). 처리했으면 true
async function panelAct(act, b, key) {
  const msg = t => { const el = $("repMsg"); if (el) { el.className = "msg"; el.textContent = t; } };
  const err = e => { const el = $("repMsg") || $("mpMsg"); if (el) { el.className = "msg err"; el.textContent = e.message; } else toast(e.message); };
  try {
    if (act === "openfile") { await api("open-file", { path: b.dataset.path }); return true; }
    if (act === "reveal") { await api("reveal", { path: b.dataset.path }); return true; }
    if (act === "unlink") { await api("unlink", { key: MP.key, path: b.dataset.path }); await showMaterials(MP.key); load(); return true; }
    if (act === "refind") { const q = $("mpQ"); q.value = b.dataset.name.replace(/\.[^.]+$/, ""); MP.sel = 0; mpResults(); q.focus(); return true; }
    if (act === "mplinkp") { await mpLink([{ p: b.dataset.path, r: "" }]); return true; }
    if (act === "mplink") { await mpLink([MP.items[+b.dataset.i].f]); return true; }
    if (act === "mpin") { const q = $("mpQ"); q.value = MP.items[+b.dataset.i].path + "/"; MP.sel = 0; mpResults(); q.focus(); return true; }
    if (act === "mpmore") { MP.limit += 20; mpResults(); return true; }
    if (act === "mpbrowse") { if (MP.browse) { MP.browse = null; mpBrowseDraw(); } else await mpBrowse(MP.start.root, MP.start.path); return true; }
    if (act === "mpls") { await mpBrowse(b.dataset.root, b.dataset.path); return true; }
    if (act === "mpbclose") { MP.browse = null; mpBrowseDraw(); return true; }
    if (act === "mpbadd") { b.disabled = true; await mpLink([...MP.browse.checked.values()]); return true; }
    if (act === "summarize") {
      if (!confirm("이 자료의 요약을 " + AI() + " 로 만듭니다 (구독 사용량을 씀, 몇 분). 진행할까요?")) return true;
      await post("job/summary", { path: b.dataset.path }); closeSheet(); toast("요약을 시작합니다 — 위 상태 줄에서 진행 상황"); return true;
    }
    if (act === "reppdf") { b.disabled = true; const r = await api("report-pdf", { key: REP.key }); msg(r.message + (r.pages > 1 ? " ⚠️ 한 장을 넘습니다" : "")); b.disabled = false; return true; }
    if (act === "repwin") { b.disabled = true; await api("report-brief", repBrief()); const r = await api("workspace", { key: REP.key }); msg(r.message); REP.exists = true; b.disabled = false; return true; }
    if (act === "repdraft" || act === "repfile" || act === "repchat") { b.disabled = true; await repAction(act); b.disabled = false; return true; }
    if (act === "repclose" || act === "matclose") { closeSheet(); return true; }
  } catch (e) { err(e); b.disabled = false; return true; }
  return false;
}

const rowsNow = () => [...document.querySelectorAll("#view [data-row], #more details[open] [data-row]")].filter(r => r.offsetParent);
function moveRow(dir) {
  const R = rowsNow(); if (!R.length) return;
  const cur = document.activeElement.closest?.("[data-row]"), i = R.indexOf(cur);
  const n = R[i < 0 ? (dir > 0 ? 0 : R.length - 1) : Math.max(0, Math.min(R.length - 1, i + dir))];
  n.focus(); n.scrollIntoView({ block: "nearest" });
}
document.addEventListener("keydown", e => {
  if (e.defaultPrevented) return;
  const m = $("menu");
  if (!m.hidden && m.contains(document.activeElement) && /^(ArrowDown|ArrowUp|Home|End)$/.test(e.key)) {
    e.preventDefault();
    const B = [...m.querySelectorAll("button")], i = B.indexOf(document.activeElement);
    const j = e.key === "Home" ? 0 : e.key === "End" ? B.length - 1 : (i + (e.key === "ArrowDown" ? 1 : -1) + B.length) % B.length;
    B[j].focus(); return;
  }
  if (e.key === "Escape") { if (!m.hidden) closeMenu(); else closeSheet(); return; }
  if (!$("scrim").hidden) {  // 시트 안에 포커스 가두기
    if (e.key === "Tab") {
      const F = [...$("sheet").querySelectorAll("button,input,textarea,select,summary,[href]")].filter(x => !x.disabled && x.offsetParent);
      if (F.length && e.shiftKey && document.activeElement === F[0]) { e.preventDefault(); F[F.length - 1].focus(); }
      else if (F.length && !e.shiftKey && document.activeElement === F[F.length - 1]) { e.preventDefault(); F[0].focus(); }
    }
    return;
  }
  const typing = /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName);
  if ((e.key === "k" && (e.ctrlKey || e.metaKey)) || (e.key === "/" && !typing)) { e.preventDefault(); $("quickInput").focus(); return; }
  if (typing || !D || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === "?") { e.preventDefault(); keysSheet(); return; }
  if (e.key === "t" || e.key === "w") { view = e.key === "t" ? "today" : "week"; render(); return; }
  const row = document.activeElement.closest?.("[data-row]"), onRow = row && document.activeElement === row;
  if (e.key === "j" || (onRow && e.key === "ArrowDown")) { e.preventDefault(); moveRow(1); return; }
  if (e.key === "k" || (onRow && e.key === "ArrowUp")) { e.preventDefault(); moveRow(-1); return; }
  if (onRow && e.key === "Enter") { e.preventDefault(); row.querySelector(".ra .tbtn")?.click(); return; }
  if (onRow && e.key === "x") { row.querySelector(".ck")?.click(); return; }
  if (onRow && e.key === ".") { const d = row.querySelector("[data-menu]"); if (d) openMenu(d, d.dataset.menu); return; }
  if (view === "week" && (e.key === "ArrowLeft" || e.key === "ArrowRight")) {
    const base = wkIdx === null ? curWeekIdx(ymdOf(new Date())) : wkIdx;
    wkIdx = Math.max(0, Math.min((D.semester || []).length - 1, base + (e.key === "ArrowLeft" ? -1 : 1))); render();
  }
});
window.addEventListener("resize", () => closeMenu(false));
window.addEventListener("scroll", () => { if (!$("menu").contains(document.activeElement)) closeMenu(false); }, { passive: true });

function tickTimer() {
  if (!D || !D.active) return;
  const s = Math.max(0, Math.floor((Date.now() - dt(D.active.start)) / 1000));
  const txt = `${Math.floor(s / 3600)}:${pad(Math.floor(s / 60) % 60)}:${pad(s % 60)}`;  // 늘 시:분:초 — '23:00' 이 시각처럼 읽히지 않게
  for (const id of ["elapsed", "elapsed2"]) { const el = $(id); if (el) el.textContent = txt; }
}
load();
setInterval(() => {  // 30초마다(휴대폰은 5분) 새 데이터 — 메뉴·시트를 보고 있거나 입력 중이면 건너뜀
  if ($("menu").hidden && $("scrim").hidden && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) load();
}, (MOB ? 300 : 30) * 1000);
setInterval(tickTimer, 1000);
</script>
</body>
