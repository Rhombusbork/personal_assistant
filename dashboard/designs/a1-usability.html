    <div class="rows">${sd.map(t => `<div class="row nt"${rowAttr(t)}>${ck(t)}<div class="body"><div class="ttl">${esc(t.title)}</div>${t.course ? `<div class="meta">${esc(t.course)}</div>` : ""}</div>
      <span class="ra">${t.source === "inbox" ? `<button class="tbtn" data-act="dotoday" data-key="${esc(t.key)}" data-label="오늘 빈 시간에 넣기">오늘 하기</button>` : ""}${dots(t)}</span></div>`).join("") || `<p class="empty">아직 없음</p>`}</div>
    <form class="inline" data-form="someday"><input class="field" type="text" placeholder="하고 싶은 일 추가" aria-label="하고 싶은 일 추가"><button class="btn" type="submit" style="height:36px">추가</button></form></div></details>`;
  if (ex.length) h += `<details data-k="excluded" ${det("excluded")}><summary><span class="ttl">제외한 것</span><span class="hint">${ex.length}개 · 취소하면 다시 나타남</span><span class="chev">›</span></summary><div class="inner">
    ${ex.map(x => `<div class="citem"><span class="tx">${esc(x.keep ? "예외(계속 보이기): " + (x.titles[0] || x.text) : x.text)}<small>${x.keep ? "단어 규칙에 걸려도 보이게" : (x.pattern ? "앞으로 같은 이름도 계속" : "이 과제만") + ` · 걸린 과제 ${x.count}개`}</small></span>
      <span class="ac"><button class="tbtn" data-act="unign" data-label="제외 취소">취소</button></span></div>`).join("")}</div></details>`;
  h += `<details data-k="stats" ${det("stats")}><summary><span class="ttl">통계</span><span class="hint">학습량 · 과목별 진행 · 완료 추이 · 걸린 시간 · 돌아보기</span><span class="chev">›</span></summary><div class="inner">${statsHtml(today)}</div></details>`;
  return h;
}
function statsHtml(today) {
  const days14 = [...Array(14)].map((_, i) => addDays(today, i));
  const planMin = d => D.plan.filter(p => ymd(p.start) === d).reduce((s, p) => s + mins(p.end) - mins(p.start), 0);
  const maxLoad = Math.max(D.cap, ...days14.map(planMin));
  const tick = (d, i) => i % 2 ? "&nbsp;" : `${+d.slice(5, 7)}/${+d.slice(8)}`;
  const load = `<div class="bars"><div class="cap" style="bottom:${D.cap / maxLoad * 100}%" title="하루 한도 ${dur(D.cap)}"></div>${days14.map((d, i) => { const m = planMin(d);
    return `<div class="b ${m > D.cap ? "over" : ""}" title="${label(d)} ${dur(m)}"><i style="height:${m / maxLoad * 100}%"></i><span>${tick(d, i)}</span></div>`; }).join("")}</div>`;
  const past14 = [...Array(14)].map((_, i) => addDays(today, i - 13)), maxDone = Math.max(1, ...past14.map(d => D.doneByDay[d] || 0));
  const trend = `<div class="bars">${past14.map((d, i) => `<div class="b" title="${label(d)} ${D.doneByDay[d] || 0}건"><i style="height:${(D.doneByDay[d] || 0) / maxDone * 100}%"></i><span>${tick(d, i)}</span></div>`).join("")}</div>`;
  const prog = D.progress.map(p => `<div class="prog"><div class="r"><span>${esc(p.course)}</span><span class="num">${p.done}/${p.total}</span></div><div class="tr"><i style="width:${p.total ? p.done / p.total * 100 : 0}%"></i></div></div>`).join("") || `<p class="empty">아직 없음</p>`;
  const ses = D.sessionsToday.length ? D.sessionsToday.map(s => { const t = findTask(s.key); return `<div class="citem"><span class="tx">${hm(s.start)}${s.end ? "–" + hm(s.end) : " (진행 중)"} ${esc(t ? t.title : s.key)}</span><span class="small">${s.minutes ? dur(s.minutes) : ""}</span></div>`; }).join("")
    : `<p class="small">⏱ 시간 재기로 기록하면 여기에 쌓이고, 쌓인 기록으로 예상 시간을 고칩니다.</p>`;
  const cal = (D.calibration || []).length ? D.calibration.map(c => `<div class="citem"><span class="tx">${esc(c.what)}</span><span class="small">예상의 ×${c.factor} (${c.n}번)</span></div>`).join("")
    : `<p class="small">같은 종류가 3번 기록되면 계획에 반영됩니다.</p>`;
  const q = D.quiz || {};
  const quiz = `<p class="small" style="margin:0">마지막으로 가져온 기록: ${q.backupAt ? stamp(q.backupAt) : "없음"}${q.stale ? " (오래됨)" : ""}</p>${Object.entries(q.dueBySubject || {}).map(([s, n]) => `<div class="citem"><span class="tx">${esc(s)}</span><span class="small">복습 ${n}</span></div>`).join("")}
    <button class="tbtn" data-act="openquiz" data-label="퀴즈 앱 열기" style="padding-left:0">퀴즈 앱 열기</button>`;
  const W = D.weekReview;
  const wr = W ? `<ul class="clist"><li>끝낸 일 <b>${W.doneTotal}</b>${W.doneTotal ? " (" + Object.entries(W.done).map(([k, n]) => `${KIND[k] || k} ${n}`).join(", ") + ")" : ""}</li>
    <li>기록 ${W.trackedCount ? `${W.trackedCount}번 · 실제 ${dur(W.trackedMinutes)} / 예상 ${dur(W.trackedEstimate)}` : "없음"}</li>
    <li>${W.missed.length ? `놓친 마감 ${W.missed.length}: ${W.missed.map(m => esc(m.title)).join(", ")}` : "놓친 마감 없음"}</li>
    <li>다음 주 마감 ${W.nextCount}개 · 예상 ${dur(W.nextMinutes)}${W.nextExams.length ? " · 시험 " + W.nextExams.map(esc).join(", ") : ""}</li></ul>` : `<p class="empty">아직 없음</p>`;
  const S = (t, s, b) => `<div class="stat"><h3>${t} <small>${s}</small></h3>${b}</div>`;
  return `<div class="stats">${S("일별 학습량", "계획 · 점선 = 하루 한도", load)}${S("완료 추이", "14일", trend)}${S("과목별 진행", "추적한 항목 중 완료", prog)}
    ${S("이번 주 돌아보기", "월요일부터", wr)}${S("오늘 실제로 한 시간", "기록", ses)}${S("예상 시간 보정", "기록 3번 이상부터", cal)}${S("퀴즈 복습", "기록 내보내기 기준", quiz)}</div>`;
}

// ---- ⋯ 메뉴 (열면 첫 항목에 포커스, ↑↓ 로 이동, 닫으면 누른 버튼으로 포커스가 돌아간다)
function openMenu(btn, key) {
  const t = findTask(key), m = $("menu");
  if (!t) return;
  closeMenu(false);
  UI.menuKey = key; UI.menuFrom = btn;
  btn.setAttribute("aria-expanded", "true");
  fillMenu(t);
  m.hidden = false;
  const r = btn.getBoundingClientRect(), W = m.offsetWidth, H = m.offsetHeight;
  let left = Math.min(window.innerWidth - W - 16, Math.max(16, r.right - W)), top = r.bottom + 4;
  if (top + H > window.innerHeight - 16) top = Math.max(16, r.top - H - 4);
  m.style.left = left + "px"; m.style.top = top + "px";
  m.querySelector("button").focus({ preventScroll: true });
}
function fillMenu(t) {
  $("menu").setAttribute("aria-label", t.title);
  $("menu").innerHTML = `<div class="mh" aria-hidden="true">${esc(t.title)}</div>` + menuItems(t).map(g => g.map(x =>
    `<button role="menuitem" class="${x.strong ? "strong" : ""} ${x.danger ? "danger" : ""}" data-act="${x.act}" data-key="${esc(t.key)}" data-label="${esc(x.label)}">${esc(x.label)}${x.hint ? `<small>${esc(x.hint)}</small>` : ""}</button>`).join("")).join(`<hr aria-hidden="true">`);
}
function closeMenu(restore = true) {
  const m = $("menu"), from = UI.menuFrom;
  if (m.hidden) return;
  const had = m.contains(document.activeElement);
  m.hidden = true; UI.menuKey = null; UI.menuFrom = null;
  if (from) { from.setAttribute("aria-expanded", "false"); if (restore && had && document.contains(from)) from.focus({ preventScroll: true }); }
}
function ignoreMenu(key) {  // 제외: 이것만(되돌리기 가능 → 바로) / 앞으로도(규칙이 남음 → 확인 창)
  const t = findTask(key);
  $("menu").innerHTML = `<div class="mh" aria-hidden="true">제외 — ${esc(t ? t.title : "")}</div>
    <button role="menuitem" data-act="ign-one" data-key="${esc(key)}" data-label="이것만 제외">이것만<small>이 과제 하나 · 되돌리기 가능</small></button>
    <button role="menuitem" data-act="ign-all" data-key="${esc(key)}" data-label="앞으로도 제외">앞으로도…<small>같은 이름 계속 · 확인 후</small></button><hr aria-hidden="true">
    <button role="menuitem" data-menu="${esc(key)}">취소</button>`;
  $("menu").querySelector("button").focus({ preventScroll: true });
}

// ---- 시트 (보고서 작성 창 · 자료 창 · 확인 · 행동 · 단축키): 위에 뜨고, 포커스를 가두고, 닫으면 원래 자리로
function openSheet(html) {
  if ($("scrim").hidden) UI.sheetFrom = document.activeElement;
  $("sheet").innerHTML = html; $("scrim").hidden = false;
  ($("sheet").querySelector("[data-autofocus]") || $("sheet").querySelector("button,textarea,input"))?.focus({ preventScroll: true });
}
function closeSheet() {
  if ($("scrim").hidden) return;
  $("scrim").hidden = true;
  const f = UI.sheetFrom; UI.sheetFrom = null;
  if (f && document.contains(f)) f.focus({ preventScroll: true });
}
const sheetTop = (title, sub) => `<div class="sh-top"><h3 id="sheetTitle">${esc(title)}</h3><button class="icon-btn" data-ui="sheetclose" aria-label="닫기">✕</button></div>${sub ? `<p class="small" style="margin:4px 0 0">${sub}</p>` : ""}`;
function reportSheet(t) {
  const today = ymdOf(new Date());
  openSheet(sheetTop(t.title, `${t.course ? esc(t.course) + " · " : ""}마감 ${t.due ? `${label(ymd(t.due))} ${hm(t.due)} (${ddayText(t.due, today)})` : "없음"}`)
    + `<details style="margin-top:16px"><summary class="small"><span class="chev">›</span> Canvas 과제 설명</summary><p class="small">실제 화면에서는 여기에 Canvas 설명을 불러옵니다 (시안이라 읽지 않음).</p></details>
    <p class="small" style="margin:8px 0 0">참고 자료: ${links(t).length ? links(t).map(esc).join(", ") : "연결 없음 — 자료 창에서 고르기"} <button class="link" data-act="mat" data-key="${esc(t.key)}" data-label="자료">자료 고르기</button></p>
    <textarea placeholder="어떻게 쓸까요? (분량·구성·강조할 내용·내 의견·말투 — 비워도 됨)" aria-label="작성 지침"></textarea>
    <label class="small"><input type="checkbox" checked> 내 생각·경험이 들어갈 자리는 비워 두기</label>
    <div class="ways"><button class="primary" data-act="repchat" data-label="채팅에서 같이 쓰기">채팅에서 같이 쓰기<small>보고서 파일을 VSCode 에 열고, 요청을 복사 → Claude 채팅에 붙여 넣기</small></button>
      <button data-act="repdraft" data-label="초안 한 번에 만들기">초안 한 번에 만들기<small>Claude 가 뒤에서 전체 초안 (구독 사용, 몇 분)</small></button>
      <button data-act="repwin" data-label="VSCode 작업 창">VSCode 작업 창 열기<small>report 폴더를 새 창으로 + 보고서 파일</small></button>
      <button data-act="repfile" data-label="빈 파일만 만들기">빈 파일만 만들고 열기<small>이름·제목·학번 줄만. Claude 안 씀</small></button>
      <button data-act="reppdf" data-label="PDF 만들기">PDF 만들기 · 위치 보기<small>파일이 있을 때 — A4 쪽수 확인</small></button></div>`);
}
function matSheet(t) {
  const ls = links(t);
  openSheet(sheetTop("자료 — " + t.title, `연결된 자료 ${ls.length}개 · 보고서·내용정리가 이것만 참고`)
    + (ls.length ? `<div class="lchips">${ls.map(n => `<button class="lchip" data-act="openfile" data-label="자료 열기" title="${esc(n)}">${esc(n)}</button>`).join("")}</div>` : "")
    + `<input class="field" type="text" style="width:100%;margin-top:16px" placeholder="자료 찾기 — 예) 17강 배포 · 자료/ 처럼 / 로 폴더" aria-label="자료 찾기">
    <p class="small">시안이라 파일 목록은 읽지 않습니다. 실제 화면: 추천 · 실시간 찾기 · 폴더 둘러보기 · 다운로드에서 찾기.</p>
    <div class="ways"><button data-act="mpbrowse" data-label="폴더 둘러보기">폴더 둘러보기</button><button data-act="quizcopy" data-key="${esc(t.key)}" data-label="퀴즈 요청 복사">퀴즈 요청 복사<small>연결된 자료로 — 채팅에 붙여 넣기</small></button></div>`);
}

// 오류 예방 (닐슨 5): 되돌리기 어려운 것만 확인 창. 기본 버튼은 '취소' 쪽에 포커스.
function confirmSheet(title, body, okLabel, act, key) {
  openSheet(sheetTop(title) + `<p class="confirm-x">${body}</p>
    <div class="confirm-acts"><button class="btn" data-ui="sheetclose" data-autofocus>취소</button>
    <button class="btn danger" data-act="${act}" data-key="${esc(key || "")}" data-label="${esc(okLabel)}">${esc(okLabel)}</button></div>`);
}
// 터치: 줄을 누르면 이 시트 — 주 행동이 맨 위에 크게, 나머지는 ⋯ 메뉴와 같은 순서
function actionSheet(t) {
  const P = primaryOf(t), today = ymdOf(new Date());
  const items = menuItems(t).flat().filter(x => !(x.act === P.act));
  openSheet(sheetTop(t.title) + `<p class="asheet-meta">${[KIND[t.kind], t.course && esc(t.course), t.due && `마감 ${label(ymd(t.due))} ${hm(t.due)} (${ddayText(t.due, today)})`].filter(Boolean).join(" · ")}</p>
    <div class="ways"><button class="primary" data-act="${P.act}" data-key="${esc(t.key)}" data-label="${esc(P.label)}">${esc(P.label)}</button>
    </div><div class="alist">${items.map(x => `<button data-act="${x.act}" data-key="${esc(t.key)}" data-label="${esc(x.label)}" class="${x.danger ? "danger" : ""}">${esc(x.label)}${x.hint && x.hint.length > 1 ? `<small>${esc(x.hint)}</small>` : ""}</button>`).join("")}</div>`);
}
function keysSheet() {
  const K = [["/", "또는 Ctrl+K — 새 할 일 입력"], ["t · w", "오늘 · 주차별 보기"], ["j · k", "다음 · 이전 줄로 (↓ ↑ 도 됨)"], ["Enter", "고른 줄의 주 행동"],
    ["x", "고른 줄 완료 (되돌리기 가능)"], [".", "고른 줄의 ⋯ 메뉴"], ["← →", "주차별에서 이전 · 다음 주"], ["Esc", "메뉴 · 창 닫기"], ["?", "이 도움말"]];
  openSheet(sheetTop("단축키") + `<dl class="keys">${K.map(([k, v]) => `<dt>${k.split(" ").map(x => /^[·또는]$/.test(x) ? x : `<kbd>${esc(x)}</kbd>`).join(" ")}</dt><dd>${v}</dd>`).join("")}</dl>`);
}

// ---- 알림 띠 (되돌리기 단추를 붙일 수 있다 — 닐슨 3 사용자 통제)
function toast(text, undo, ms) {
  const el = $("toast");
  el.innerHTML = `<span>${esc(text)}</span>${undo ? `<button data-act="undo" data-label="되돌리기">되돌리기</button>` : ""}`;
  el.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => { el.hidden = true; }, ms || (undo ? 6000 : 2600));
}
const fake = (what, undo) => toast(`시안: '${what}' — 실제 동작은 하지 않음`, undo);

// ---- 입력
if (matchMedia("(max-width: 600px)").matches) $("quickInput").placeholder = "새 할 일 — 예) 발표 @금 18시 ~2h";
$("days").innerHTML = ["월", "화", "수", "목", "금", "토", "일"].map((d, i) => `<label><input type="checkbox" value="${i}"><span>${d}</span></label>`).join("");
$("fullToggle").addEventListener("click", () => { const f = $("addForm"); f.hidden = !f.hidden; $("fullToggle").textContent = f.hidden ? "자세히" : "접기"; });
document.querySelectorAll("[data-day]").forEach(b => b.addEventListener("click", () => {
  const f = $("addForm"), v = b.dataset.day, d = new Date();
  if (v === "clear") { f.date.value = ""; f.time.value = ""; return; }
  if (v === "fri") d.setDate(d.getDate() + ((5 - d.getDay() + 7) % 7)); else d.setDate(d.getDate() + +v);
  f.date.value = ymdOf(d);
}));
$("quickForm").addEventListener("submit", e => { e.preventDefault(); fake("할 일 추가"); });
$("addForm").addEventListener("submit", e => { e.preventDefault(); fake("할 일 추가 (자세히)"); });
document.addEventListener("submit", e => { if (e.target.dataset.form === "someday") { e.preventDefault(); fake("하고 싶은 일 추가"); } });

document.addEventListener("click", e => {
  const tab = e.target.closest("[data-view]");
  if (tab) { view = tab.dataset.view; try { localStorage.setItem("pa.a1.view", view); } catch {} closeMenu(); render(); return; }
  const wk = e.target.closest("[data-wk]");
  if (wk) { if (!wk.disabled) { wkIdx = +wk.dataset.wk; render(); } return; }
  const mb = e.target.closest("[data-menu]");
  if (mb) {
    if ($("menu").contains(mb)) { fillMenu(findTask(mb.dataset.menu)); $("menu").querySelector("button").focus(); return; }  // 제외 → 취소: 같은 자리에서 원래 목록으로
    if (UI.menuKey === mb.dataset.menu && !$("menu").hidden) closeMenu(); else openMenu(mb, mb.dataset.menu);
    return;
  }
  const ui = e.target.closest("[data-ui]");
  if (ui) {
    const u = ui.dataset.ui;
    if (u === "tolate") { if (view !== "today") { e.preventDefault(); view = "today"; render(); $("late")?.scrollIntoView(); } return; }
    if (u === "sheetclose") { closeSheet(); return; }
    if (u === "keys") { keysSheet(); return; }
    if (u === "tohero") { $("hero")?.scrollIntoView({ block: "start" }); return; }
    if (u === "jobs") { UI.open.add("check"); if (view !== "today") view = "today"; render(); $("jobs")?.scrollIntoView({ block: "center" }); return; }
    if (u === "alldues") UI.allDues = !UI.allDues;
    if (u === "alldl") UI.allDl = !UI.allDl;
    render(); return;
  }
  if (e.target === $("scrim")) { closeSheet(); return; }
  const b = e.target.closest("[data-act]");
  if (!b) {
    if (!$("menu").contains(e.target)) closeMenu(false);
    // 터치(또는 좁은 화면): 줄 아무 데나 누르면 행동 시트 — 마우스 올리기 없이도 모든 행동에 닿는다
    const row = e.target.closest("[data-row]");
    if (row && COARSE.matches && !e.target.closest("a,input,select,summary")) { const t = findTask(row.dataset.row); if (t) actionSheet(t); }
    return;
  }
  const act = b.dataset.act, key = b.dataset.key, t = findTask(key);
  if (act === "ignore") { ignoreMenu(key); return; }
  if (act === "ign-all") { closeMenu(false); confirmSheet("앞으로도 제외할까요?", `「${esc(t ? t.title : "")}」 과 <b>같은 이름</b>의 과제가 앞으로 새로 올라와도 계속 숨겨집니다. 아래 '제외한 것'에서 언제든 취소할 수 있습니다.`, "앞으로도 제외", "ign-all-ok", key); return; }
  if (act === "remove") { closeMenu(false); confirmSheet("이 할 일을 삭제할까요?", `「${esc(t ? t.title : "")}」 을(를) inbox.md 에서 지웁니다. 되돌릴 수 없습니다 — 끝낸 거라면 '완료'를 쓰세요.`, "삭제", "remove-ok", key); return; }
  if (act === "report" && t) { closeMenu(false); closeSheet(); reportSheet(t); return; }
  if (act === "mat" && t) { closeMenu(false); closeSheet(); matSheet(t); return; }
  closeMenu(); closeSheet();
  if (act === "done") {
    if (b.classList.contains("ck")) { b.classList.add("on"); setTimeout(() => b.classList.remove("on"), 900); }
    fake(b.dataset.label || "완료", true); return;
  }
  if (act === "ign-one") { fake("이것만 제외", true); return; }
  fake(b.dataset.label || b.textContent.trim());
});

// ---- 키보드 (유연성·효율 — 닐슨 7). '?' 로 언제든 목록을 본다.
const rowsNow = () => [...document.querySelectorAll("#view [data-row], #more details[open] [data-row]")].filter(r => r.offsetParent);
function moveRow(dir) {
  const R = rowsNow(); if (!R.length) return;
  const cur = document.activeElement.closest?.("[data-row]"), i = R.indexOf(cur);
  const n = R[i < 0 ? (dir > 0 ? 0 : R.length - 1) : Math.max(0, Math.min(R.length - 1, i + dir))];
  n.focus(); n.scrollIntoView({ block: "nearest" });
}
document.addEventListener("keydown", e => {
  const m = $("menu");
  if (!m.hidden && m.contains(document.activeElement) && /^(ArrowDown|ArrowUp|Home|End)$/.test(e.key)) {
    e.preventDefault();
    const B = [...m.querySelectorAll("button")], i = B.indexOf(document.activeElement);
    const j = e.key === "Home" ? 0 : e.key === "End" ? B.length - 1 : (i + (e.key === "ArrowDown" ? 1 : -1) + B.length) % B.length;
    B[j].focus(); return;
  }
  if (e.key === "Escape") { if (!m.hidden) closeMenu(); else closeSheet(); return; }
  if (!$("scrim").hidden) {  // 시트 안에 포커스 가두기
    if (e.key === "Tab") {
      const F = [...$("sheet").querySelectorAll("button,input,textarea,select,summary,[href]")].filter(x => !x.disabled && x.offsetParent);
      if (F.length && e.shiftKey && document.activeElement === F[0]) { e.preventDefault(); F[F.length - 1].focus(); }
      else if (F.length && !e.shiftKey && document.activeElement === F[F.length - 1]) { e.preventDefault(); F[0].focus(); }
    }
    return;
  }
  const typing = /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName);
  if ((e.key === "k" && (e.ctrlKey || e.metaKey)) || (e.key === "/" && !typing)) { e.preventDefault(); $("quickInput").focus(); return; }
  if (typing || !D || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === "?") { e.preventDefault(); keysSheet(); return; }
  if (e.key === "t" || e.key === "w") { view = e.key === "t" ? "today" : "week"; render(); return; }
  const row = document.activeElement.closest?.("[data-row]"), onRow = row && document.activeElement === row;
  if (e.key === "j" || (onRow && e.key === "ArrowDown")) { e.preventDefault(); moveRow(1); return; }
  if (e.key === "k" || (onRow && e.key === "ArrowUp")) { e.preventDefault(); moveRow(-1); return; }
  if (onRow && e.key === "Enter") { e.preventDefault(); row.querySelector(".ra .tbtn")?.click(); return; }
  if (onRow && e.key === "x") { row.querySelector(".ck")?.click(); return; }
  if (onRow && e.key === ".") { const d = row.querySelector("[data-menu]"); if (d) openMenu(d, d.dataset.menu); return; }
  if (view === "week" && (e.key === "ArrowLeft" || e.key === "ArrowRight")) {
    const base = wkIdx === null ? curWeekIdx(ymdOf(new Date())) : wkIdx;
    wkIdx = Math.max(0, Math.min((D.semester || []).length - 1, base + (e.key === "ArrowLeft" ? -1 : 1))); render();
  }
});
window.addEventListener("resize", () => closeMenu(false));
window.addEventListener("scroll", () => { if (!$("menu").contains(document.activeElement)) closeMenu(false); }, { passive: true });

function tickTimer() {
  if (!D || !D.active) return;
  const s = Math.max(0, Math.floor((Date.now() - dt(D.active.start)) / 1000));
  const txt = `${Math.floor(s / 3600)}:${pad(Math.floor(s / 60) % 60)}:${pad(s % 60)}`;  // 늘 시:분:초 — '23:00' 이 시각처럼 읽히지 않게
  for (const id of ["elapsed", "elapsed2"]) { const el = $(id); if (el) el.textContent = txt; }
}
load();
setInterval(() => {  // 30초마다 새 데이터 — 메뉴·시트를 보고 있거나 입력 중이면 건너뜀 (고른 줄의 포커스는 render 가 되살린다)
  if ($("menu").hidden && $("scrim").hidden && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) load();
}, 30000);
setInterval(tickTimer, 1000);
</script>
</body>
</html>
