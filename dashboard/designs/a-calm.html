<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>비서 · 시안 A</title>
<meta name="color-scheme" content="light dark">
<style>
  /* 시안 A "차분한 집중" — 색은 의미(종류 점 + 강조 하나)에만, 구분은 상자 대신 글자 크기·굵기·회색 단계로.
     간격은 8의 배수만 쓴다 (4 는 글자 사이 미세 조정에만). */
  :root {
    --bg: #ffffff; --elev: #ffffff; --text: #1d1d1f; --text2: #6e6e73; --text3: #a1a1a6;
    --line: rgba(0, 0, 0, .08); --fill: rgba(0, 0, 0, .035); --fill2: rgba(0, 0, 0, .065);
    --accent: #0071e3; --on-accent: #ffffff; --danger: #d70015; --shadow: 0 8px 32px rgba(0, 0, 0, .14), 0 1px 3px rgba(0, 0, 0, .08);
    --lecture: #3b82f6; --quiz: #8b5cf6; --assignment: #f59e0b; --todo: #10b981; --review: #ec4899; --busy: #c7c7cc;
    --s1: 8px; --s2: 16px; --s3: 24px; --s4: 32px; --s5: 40px; --s6: 48px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161617; --elev: #232325; --text: #f5f5f7; --text2: #98989d; --text3: #636366;
      --line: rgba(255, 255, 255, .09); --fill: rgba(255, 255, 255, .05); --fill2: rgba(255, 255, 255, .09);
      --accent: #2997ff; --danger: #ff6961; --busy: #48484a; --shadow: 0 8px 32px rgba(0, 0, 0, .5);
    }
  }
  :root[data-theme="dark"] {
    --bg: #161617; --elev: #232325; --text: #f5f5f7; --text2: #98989d; --text3: #636366;
    --line: rgba(255, 255, 255, .09); --fill: rgba(255, 255, 255, .05); --fill2: rgba(255, 255, 255, .09);
    --accent: #2997ff; --danger: #ff6961; --busy: #48484a; --shadow: 0 8px 32px rgba(0, 0, 0, .5);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", "NanumBarunGothic", "NanumGothic", system-ui, sans-serif;
         -webkit-font-smoothing: antialiased; }
  main { max-width: 720px; margin: 0 auto; padding: var(--s5) var(--s3) 96px; }
  @media (max-width: 600px) { main { padding: var(--s3) var(--s2) 96px; } }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  .num { font-variant-numeric: tabular-nums; }

  /* ---- 머리 */
  header { display: grid; grid-template-columns: 1fr auto; align-items: end; gap: var(--s1) var(--s2); }
  .eyebrow { font-size: 13px; color: var(--text2); display: flex; align-items: center; gap: 6px; }
  .live { width: 6px; height: 6px; border-radius: 50%; background: var(--todo); display: inline-block; }
  .live.off { background: var(--text3); }
  h1 { font-size: 32px; line-height: 1.15; letter-spacing: -.02em; margin: 0; font-weight: 700; }
  .hdr-tools { display: flex; gap: var(--s1); align-items: center; }
  .seg { display: inline-flex; background: var(--fill2); border-radius: 9px; padding: 2px; }
  .seg button { border: 0; background: none; padding: 4px 12px; border-radius: 7px; font-size: 13px; color: var(--text2); }
  .seg button.on { background: var(--elev); color: var(--text); font-weight: 600; box-shadow: 0 1px 2px rgba(0, 0, 0, .12); }
  .hdr-eye { grid-column: 1 / -1; margin-bottom: -8px; }
  .summary { grid-column: 1 / -1; margin: 0; font-size: 14px; color: var(--text2); }
  .summary b { color: var(--text); font-weight: 600; }
  .summary .bad { color: var(--danger); }

  .icon-btn { width: 32px; height: 32px; border: 0; border-radius: 8px; background: transparent; color: var(--text2);
              display: inline-grid; place-items: center; font-size: 17px; line-height: 1; padding: 0; flex: none; }
  .icon-btn:hover { background: var(--fill2); color: var(--text); }

  /* ---- 빠른 입력 */
  .quick { margin-top: var(--s3); display: flex; align-items: center; gap: var(--s1); border-bottom: 1px solid var(--line); padding-bottom: var(--s1); }
  .quick .plus { color: var(--accent); font-size: 20px; width: 24px; text-align: center; line-height: 1; }
  .quick input { flex: 1; min-width: 0; border: 0; background: none; padding: 8px 0; font-size: 15px; outline: none; }
  .quick input::placeholder { color: var(--text3); }
  .link { border: 0; background: none; color: var(--accent); padding: 4px 0; font-size: 13px; }
  .link:hover { text-decoration: underline; }
  .link.muted { color: var(--text2); }
  kbd { font: 11px/1 inherit; color: var(--text3); border: 1px solid var(--line); border-radius: 4px; padding: 2px 5px; }
  .full { display: grid; gap: var(--s1); padding: var(--s2) 0 var(--s1) 32px; }
  .full[hidden] { display: none; }
  .frow { display: flex; flex-wrap: wrap; gap: var(--s1); align-items: center; }
  .frow > .lbl { font-size: 13px; color: var(--text2); width: 40px; }
  .field { background: var(--fill); border: 1px solid transparent; border-radius: 8px; padding: 6px 10px; min-width: 0; }
  .field:focus { border-color: var(--accent); outline: none; }
  .chip { border: 0; background: var(--fill2); border-radius: 99px; padding: 4px 12px; font-size: 13px; }
  .chip:hover { background: color-mix(in srgb, var(--accent) 14%, transparent); }
  .days { display: flex; gap: 4px; }
  .days input { position: absolute; opacity: 0; pointer-events: none; }
  .days span { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: var(--fill); font-size: 13px; cursor: pointer; }
  .days input:checked + span { background: var(--accent); color: var(--on-accent); }

  /* ---- 버튼 */
  .btn { height: 40px; padding: 0 var(--s2); border: 0; border-radius: 10px; background: var(--fill2); font-size: 15px; font-weight: 600; white-space: nowrap; }
  .btn:hover { filter: brightness(.97); }
  .btn.primary { background: var(--accent); color: var(--on-accent); }
  .btn.plain { background: transparent; color: var(--accent); padding: 0 12px; }
  .btn.plain:hover { background: var(--fill); }
  .tbtn { border: 0; background: none; color: var(--accent); font-size: 13px; font-weight: 600; padding: 4px 8px; border-radius: 6px; white-space: nowrap; }
  .tbtn:hover { background: var(--fill2); }
  .tbtn.gray { color: var(--text2); font-weight: 500; }

  /* ---- 지금 할 일 (주인공) */
  .hero { margin-top: var(--s5); }
  .hero .eyebrow { color: var(--accent); font-weight: 600; }
  .hero .eyebrow .sep { color: var(--text3); font-weight: 400; }
  .hero-head { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: start; margin-top: var(--s1); }
  .hero-title { font-size: 24px; line-height: 1.3; letter-spacing: -.015em; margin: 0; font-weight: 700; overflow-wrap: anywhere; }
  .hero .ck { width: 24px; height: 24px; margin-top: 4px; }
  .hero-meta { font-size: 14px; color: var(--text2); margin-top: 4px; }
  .hero-body { min-width: 0; }
  .bar { height: 4px; border-radius: 99px; background: var(--fill2); margin-top: var(--s2); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
  .hero-acts { display: flex; flex-wrap: wrap; gap: var(--s1); margin-top: var(--s2); align-items: center; }
  .why { font-size: 13px; color: var(--text3); margin: var(--s1) 0 0; }
  .timer-num { font-size: 40px; font-weight: 300; letter-spacing: -.02em; font-variant-numeric: tabular-nums; margin-top: var(--s1); }

  /* ---- 확인할 것 (하나로 접음) */
  details > summary { list-style: none; cursor: pointer; }
  details > summary::-webkit-details-marker { display: none; }
  .chev { display: inline-block; color: var(--text3); transition: transform .15s; font-size: 13px; }
  details[open] > summary .chev { transform: rotate(90deg); }
  .check { margin-top: var(--s4); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .check > summary { display: flex; align-items: center; gap: 12px; padding: 12px 0; min-height: 48px; }
  .check > summary:hover .ttl { color: var(--accent); }
  .cnt { min-width: 24px; height: 24px; padding: 0 7px; border-radius: 12px; background: var(--fill2); font-size: 13px; font-weight: 600;
         display: inline-grid; place-items: center; }
  .cnt.hot { background: var(--accent); color: var(--on-accent); }
  .check .ttl { font-weight: 600; }
  .check .hint { flex: 1; min-width: 0; color: var(--text2); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .check-body { padding: 0 0 var(--s2) 36px; }
  @media (max-width: 600px) { .check-body { padding-left: 0; } }
  .cgrp { margin-top: var(--s2); }
  .cgrp:first-child { margin-top: 0; }
  .cgrp-h { font-size: 13px; font-weight: 600; color: var(--text2); margin: 0 0 4px; display: flex; gap: var(--s1); align-items: baseline; }
  .cgrp-h .tbtn { margin-left: auto; }
  .citem { display: flex; gap: var(--s1); align-items: baseline; padding: 6px 0; font-size: 14px; }
  .citem .tx { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .citem .tx small { display: block; color: var(--text2); font-size: 13px; }
  .citem .ac { display: flex; gap: 2px; flex: none; flex-wrap: wrap; justify-content: flex-end; }
  .citem code { font-size: 12px; background: var(--fill2); border-radius: 4px; padding: 0 4px; }
  .dl-sel { font-size: 12px; padding: 2px 4px; border-radius: 6px; border: 0; background: var(--fill2); max-width: 96px; }
  .clist { margin: 0; padding-left: 18px; font-size: 14px; color: var(--text); }
  .clist li { margin: 2px 0; }
  .clist li::marker { color: var(--text3); }

  /* ---- 섹션 */
  .sec { margin-top: var(--s5); }
  .sec-h { display: flex; align-items: baseline; gap: var(--s1); margin: 0 0 var(--s1); }
  .sec-h h2 { font-size: 20px; letter-spacing: -.01em; margin: 0; font-weight: 700; }
  .sec-h .aside { color: var(--text2); font-size: 13px; }
  .sec-h .link { margin-left: auto; }

  /* ---- 줄 (타임라인·마감 공통) */
  .rows { display: grid; }
  .row { display: grid; grid-template-columns: 56px 20px minmax(0, 1fr) auto; gap: 0 12px; align-items: start; padding: 8px; margin: 0 -8px; border-radius: 10px; }
  .row.nt { grid-template-columns: 20px minmax(0, 1fr) auto; }
  .row:hover { background: var(--fill); }
  .row .t { font-size: 14px; color: var(--text2); padding-top: 1px; line-height: 1.35; }
  .row .t small { display: block; color: var(--text3); font-size: 12px; }
  .row .body { min-width: 0; }
  .row .ttl { font-size: 15px; font-weight: 500; overflow-wrap: anywhere; line-height: 1.4; }
  .row .meta { font-size: 13px; color: var(--text2); margin-top: 2px; }
  .row .ra { display: flex; align-items: center; gap: 2px; margin-top: -4px; }
  .row .ra .tbtn { opacity: 0; transition: opacity .12s; }
  .row:hover .ra .tbtn, .row:focus-within .ra .tbtn, .row.cur .ra .tbtn { opacity: 1; }
  @media (hover: none) and (min-width: 601px) { .row .ra .tbtn { display: none; } .row.cur .ra .tbtn { display: inline-block; opacity: 1; } }
  .row .ra .icon-btn { width: 28px; height: 28px; color: var(--text3); }
  .row:hover .ra .icon-btn { color: var(--text2); }
  .row.past { opacity: .4; }
  .row.cur .t { color: var(--accent); font-weight: 600; }
  .row.cur .t small { color: var(--accent); font-weight: 400; opacity: .8; }
  .row.busy .ttl { color: var(--text2); font-weight: 400; }
  .bmark { width: 4px; height: 20px; border-radius: 2px; background: var(--busy); margin: 1px auto 0; }
  @media (max-width: 600px) {
    .row { grid-template-columns: 44px 20px minmax(0, 1fr) auto; gap: 0 10px; }
    .row.nt { grid-template-columns: 20px minmax(0, 1fr) auto; }
    .row .ra .tbtn { display: none; }  /* 폰: 주 행동은 위 '지금 할 일'과 ⋯ 안에 */
    .gap { padding-left: 62px !important; }
    .quick kbd { display: none; }
  }
  .gap { padding: 4px 0 4px 76px; font-size: 12px; color: var(--text3); }
  .late { color: var(--danger); }
  .clip { color: var(--text3); font-size: 12px; margin-left: 4px; white-space: nowrap; }

  /* 원형 체크 — 종류 색이 곧 테두리 (색 = 의미) */
  .ck { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--k, var(--text3)); background: transparent; padding: 0; margin-top: 1px;
        display: grid; place-items: center; color: transparent; font-size: 12px; line-height: 1; }
  .ck:hover { background: color-mix(in srgb, var(--k) 16%, transparent); color: var(--k); }
  .ck.on { background: var(--k); color: #fff; }

  .day-h { font-size: 13px; font-weight: 600; color: var(--text2); margin: var(--s2) 0 0; display: flex; gap: var(--s1); align-items: baseline; }
  .day-h:first-child { margin-top: 0; }
  .day-h .d { color: var(--text3); font-weight: 400; }
  .day-h.today { color: var(--accent); }
  .day-h.danger { color: var(--danger); }
  .empty { color: var(--text3); font-size: 14px; margin: var(--s1) 0; }
  .foot { margin-top: var(--s2); font-size: 13px; color: var(--text2); }
  .done-l { margin-top: 4px; }
  .done-l div { text-decoration: line-through; color: var(--text3); font-size: 14px; }

  /* ---- 주차별 */
  .wk-nav { display: flex; align-items: center; gap: var(--s1); flex-wrap: wrap; }
  .wk-nav b { font-size: 17px; }
  .wk-nav .r { color: var(--text2); font-size: 13px; }
  .wk-nav .push { margin-left: auto; }
  .strip { display: flex; gap: 3px; margin: var(--s2) 0 var(--s1); align-items: flex-end; }
  .sw { flex: 1; min-width: 0; border: 0; background: none; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .sw i { display: block; width: 100%; max-width: 20px; border-radius: 3px; background: var(--fill2); }
  .sw span { font-size: 11px; color: var(--text3); line-height: 1; }
  .sw.past i { opacity: .5; }
  .sw.cur span { color: var(--text); font-weight: 600; }
  .sw.sel i { background: var(--accent); }
  .sw.sel span { color: var(--accent); font-weight: 700; }
  .sw em { font-style: normal; width: 4px; height: 4px; border-radius: 50%; background: var(--danger); }
  .sw:not(.ex) em { visibility: hidden; }
  .strip-note { font-size: 12px; color: var(--text3); margin: 0; }
  .kind-h { font-size: 13px; color: var(--text2); margin: var(--s2) 0 0; }

  /* ---- 아래 접힌 것들 */
  .more { margin-top: var(--s6); border-top: 1px solid var(--line); }
  .more > details { border-bottom: 1px solid var(--line); }
  .more > details > summary { display: flex; align-items: center; gap: 12px; padding: 12px 0; min-height: 48px; }
  .more > details > summary .ttl { font-weight: 500; }
  .more > details > summary .hint { color: var(--text3); font-size: 13px; flex: 1; }
  .more .inner { padding: 0 0 var(--s2); }
  .inline { display: flex; gap: var(--s1); margin-top: var(--s1); }
  .inline input { flex: 1; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: var(--s3) var(--s4); }
  .stat h3 { font-size: 13px; font-weight: 600; color: var(--text2); margin: 0 0 var(--s1); }
  .stat h3 small { font-weight: 400; color: var(--text3); }
  .bars { display: flex; align-items: flex-end; gap: 3px; height: 88px; position: relative; }
  .bars .b { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; min-width: 0; }
  .bars .b i { display: block; width: 100%; border-radius: 3px 3px 0 0; background: var(--text3); min-height: 1px; }
  .bars .b.over i { background: var(--danger); }
  .bars .b span { font-size: 10px; color: var(--text3); margin-top: 4px; white-space: nowrap; }
  .bars .cap { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--text2); }
  .prog { margin: 6px 0; font-size: 13px; }
  .prog .r { display: flex; justify-content: space-between; gap: var(--s1); }
  .prog .r span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .prog .tr { height: 4px; background: var(--fill2); border-radius: 99px; margin-top: 4px; overflow: hidden; }
  .prog .tr i { display: block; height: 100%; background: var(--text2); }
  .small { font-size: 13px; color: var(--text2); }
  .page-foot { margin-top: var(--s4); font-size: 12px; color: var(--text3); }

  /* ---- ⋯ 메뉴 · 시트 · 토스트 */
  .menu { position: fixed; z-index: 30; min-width: 232px; max-width: calc(100vw - 32px); background: var(--elev); border-radius: 12px; box-shadow: var(--shadow);
          padding: 6px; border: 1px solid var(--line); }
  .menu[hidden] { display: none; }
  .menu .mh { font-size: 12px; color: var(--text3); padding: 6px 10px 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 280px; }
  .menu button { display: flex; width: 100%; align-items: baseline; gap: var(--s1); border: 0; background: none; text-align: left; padding: 8px 10px; border-radius: 8px; font-size: 14px; }
  .menu button:hover, .menu button:focus-visible { background: var(--fill2); outline: none; }
  .menu button small { margin-left: auto; color: var(--text3); font-size: 12px; padding-left: var(--s2); white-space: nowrap; }
  .menu button.strong { font-weight: 600; color: var(--accent); }
  .menu button.danger { color: var(--danger); }
  .menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 6px; }
  .scrim { position: fixed; inset: 0; z-index: 40; background: rgba(0, 0, 0, .28); display: grid; place-items: center; padding: var(--s2); }
  .scrim[hidden] { display: none; }
  .sheet { width: min(560px, 100%); max-height: calc(100vh - 32px); overflow: auto; background: var(--elev); border-radius: 16px; box-shadow: var(--shadow); padding: var(--s3); }
  @media (max-width: 600px) { .scrim { place-items: end center; padding: 0; } .sheet { border-radius: 16px 16px 0 0; max-height: 88vh; } }
  .sheet h3 { font-size: 20px; margin: 0; letter-spacing: -.01em; overflow-wrap: anywhere; }
  .sheet .sh-top { display: flex; gap: var(--s1); align-items: start; }
  .sheet .sh-top h3 { flex: 1; min-width: 0; }
  .sheet .ways { display: grid; gap: var(--s1); margin-top: var(--s2); }
  .sheet .ways button { text-align: left; border: 0; background: var(--fill); border-radius: 10px; padding: 12px var(--s2); font-weight: 600; font-size: 15px; }
  .sheet .ways button.primary { background: var(--accent); color: var(--on-accent); }
  .sheet .ways button small { display: block; font-weight: 400; font-size: 13px; opacity: .75; margin-top: 2px; }
  .sheet textarea { width: 100%; min-height: 96px; resize: vertical; background: var(--fill); border: 1px solid transparent; border-radius: 10px; padding: 10px 12px; margin-top: var(--s1); }
  .sheet label.small { display: flex; gap: var(--s1); align-items: center; margin-top: var(--s1); }
  .lchips { display: flex; flex-wrap: wrap; gap: var(--s1); margin-top: var(--s1); }
  .lchip { border: 0; background: var(--fill2); border-radius: 99px; padding: 4px 12px; font-size: 13px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .toast { position: fixed; left: 50%; bottom: var(--s3); transform: translateX(-50%); z-index: 50; max-width: calc(100vw - 32px);
           background: var(--text); color: var(--bg); border-radius: 12px; padding: 10px var(--s2); font-size: 14px; box-shadow: var(--shadow); }
  .toast[hidden] { display: none; }
</style>
</head>
<body>
<main>
  <header>
    <div class="eyebrow hdr-eye"><span id="liveDot" class="live off"></span><span id="eyebrow">불러오는 중…</span></div>
    <h1 id="title">오늘</h1>
    <div class="hdr-tools">
      <div class="seg" role="tablist" aria-label="보기"><button data-view="today" role="tab">오늘</button><button data-view="week" role="tab">주차별</button></div>
      <button class="icon-btn" data-act="sync" data-label="동기화 (Canvas 까지 지금 확인)" title="동기화 — Canvas 까지 지금 확인" aria-label="동기화">⟳</button>
    </div>
    <p class="summary" id="summary"></p>
  </header>

  <form class="quick" id="quickForm" autocomplete="off">
    <span class="plus" aria-hidden="true">+</span>
    <input id="quickInput" type="text" placeholder="새 할 일 — 예) 린스타트업 발표 @금 18시 ~2h #창업" aria-label="새 할 일">
    <button type="button" class="link muted" id="fullToggle">자세히</button>
    <kbd title="/ 또는 Ctrl+K 로 바로 입력">/</kbd>
  </form>
  <form class="full" id="addForm" hidden autocomplete="off">
    <div class="frow"><input class="field" name="title" type="text" placeholder="제목" style="flex:1 1 240px"></div>
    <div class="frow"><span class="lbl">마감</span><input class="field" name="date" type="date"><input class="field" name="time" type="time" title="비우면 23:59">
      <button type="button" class="chip" data-day="0">오늘</button><button type="button" class="chip" data-day="1">내일</button>
      <button type="button" class="chip" data-day="fri">이번 주 금</button><button type="button" class="chip" data-day="clear">기한 없음</button></div>
    <div class="frow"><span class="lbl">예상</span>
      <select class="field" name="minutes"><option value="30">30분</option><option value="60" selected>1시간</option><option value="90">1시간 30분</option>
        <option value="120">2시간</option><option value="180">3시간</option><option value="240">4시간</option></select>
      <span class="lbl">분류</span><input class="field" name="course" type="text" list="courses" placeholder="과목·분류 (선택)" style="flex:1 1 140px"><datalist id="courses"></datalist></div>
    <div class="frow"><span class="lbl">반복</span><div class="days" id="days"></div></div>
    <div class="frow"><button class="btn primary" type="submit">추가</button></div>
  </form>

  <div id="view"></div>
  <div id="more" class="more"></div>
  <p class="page-foot" id="pageFoot"></p>
</main>

<div class="menu" id="menu" hidden role="menu"></div>
<div class="scrim" id="scrim" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden role="status"></div>

<script>
// 시안 A — 보기 전용. GET /api/data 만 읽는다 (실패하면 ../data.js). 버튼은 눌리지만 엔진에 아무것도 보내지 않는다.
const KIND = { lecture: "강의", quiz: "퀴즈", assignment: "과제", todo: "할 일", review: "퀴즈 복습" };
const WD = "일월화수목금토";
let D = null, LIVE = false, view = "today", wkIdx = null;
try { view = localStorage.getItem("pa.a.view") === "week" ? "week" : "today"; } catch {}
const UI = { open: new Set(), allDues: false, allDl: false, menuKey: null };  // 다시 그려도 펼친 상태 유지

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = n => String(n).padStart(2, "0");
const ymdOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const dt = s => new Date(s);
const ymd = iso => ymdOf(dt(iso));
const hm = iso => { const d = dt(iso); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const mins = iso => { const d = dt(iso); return d.getHours() * 60 + d.getMinutes(); };
const addDays = (y, n) => { const d = new Date(y + "T12:00:00"); d.setDate(d.getDate() + n); return ymdOf(d); };
const label = y => { const d = new Date(y + "T12:00:00"); return `${d.getMonth() + 1}/${d.getDate()}(${WD[d.getDay()]})`; };
const between = (a, b) => Math.round((new Date(b + "T12:00:00") - new Date(a + "T12:00:00")) / 864e5);
const stamp = iso => iso ? `${label(ymd(iso))} ${hm(iso)}` : "-";
const dur = m => m >= 60 ? `${Math.floor(m / 60)}시간${m % 60 ? " " + (m % 60) + "분" : ""}` : `${m}분`;
const ddayText = (due, today) => { const n = between(today, ymd(due)); return n < 0 ? "지남" : n === 0 ? "오늘" : n === 1 ? "내일" : "D-" + n; };
const relDay = (d, today) => { const n = between(today, d); return n === 0 ? "오늘" : n === 1 ? "내일" : n === 2 ? "모레" : ""; };
const kc = k => `var(--${k || "todo"})`;
const clean = s => String(s || "").replace(/^\[[^\]]+\]\s*/, "");
function findTask(k) {
  if (!k || !D) return null;
  k = String(k).split("#")[0];
  return D.tasks.find(t => t.key === k) || D.someday.find(t => t.key === k)
    || (D.semester || []).flatMap(w => w.items).find(t => t.key === k) || null;
}
const links = t => (t && D.links && D.links[t.key]) || [];
const clip = t => { const n = links(t).length; return n ? `<span class="clip" title="연결된 자료: ${esc(links(t).join(", "))}">자료 ${n}</span>` : ""; };

// ---- 행동 정의: 종류마다 '주 행동' 하나, 나머지는 ⋯ 안으로
function primaryOf(t) {
  if (!t) return null;
  if (t.kind === "lecture" && t.url) return { act: "open", label: "▶ 수업 듣기" };
  if (t.kind === "assignment") return { act: "report", label: "✍ 보고서 작성" };
  if ((t.kind === "quiz" || t.kind === "review") && t.url) return { act: "open", label: "▶ 퀴즈 풀기" };
  if (t.kind === "todo" && t.due) return { act: "report", label: "✍ 작성" };
  return { act: "start", label: "⏱ 시작" };
}
function menuItems(t) {
  const P = primaryOf(t), isActive = D.active && D.active.key === t.key, g = [[], [], [], []];
  const openName = t.kind === "assignment" ? "Canvas 에서 열기" : t.kind === "lecture" ? "수업 접속" : t.kind === "review" || t.kind === "quiz" ? "퀴즈 풀기" : "열기";
  if (t.url && t.kind !== "todo") g[0].push({ act: "open", label: openName, strong: P.act === "open" });
  if (t.kind === "assignment" || (t.kind === "todo" && t.due)) g[0].push({ act: "report", label: "보고서 작성", hint: "설명·자료·지침", strong: P.act === "report" });
  if (t.course) g[1].push({ act: "mat", label: "자료", hint: links(t).length ? `연결 ${links(t).length}` : "고르기" });
  if (t.kind === "lecture") g[1].push({ act: "sumfor", label: "내용정리", hint: "Claude 사용" },
    { act: "workspace", label: "VSCode 작업 창", hint: "study_system" }, { act: "quizcopy", label: "퀴즈 요청 복사", hint: "채팅에 붙여 넣기" });
  g[2].push(isActive ? { act: "stop", label: "기록 멈춤" } : { act: "start", label: "시간 재기 시작", hint: "⏱" });
  g[2].push({ act: "done", label: t.kind === "lecture" ? "들었음" : "완료", hint: "✓" });
  g[3].push(t.source === "inbox" ? { act: "remove", label: "삭제", danger: true } : { act: "ignore", label: "제외…", hint: "조장만 제출 등", danger: true });
  return g.filter(x => x.length);
}
const ck = (t, extra = "") => `<button class="ck${extra}" style="--k:${kc(t.kind)}" data-act="done" data-key="${esc(t.key)}" data-label="${t.kind === "lecture" ? "들었음" : "완료"}" title="${t.kind === "lecture" ? "들었음" : "완료"}" aria-label="완료">✓</button>`;
const dots = t => `<button class="icon-btn" data-menu="${esc(t.key)}" title="더 보기" aria-label="더 보기">⋯</button>`;
const rowActs = (t, withPrimary = true) => {
  const P = primaryOf(t);
  return `<span class="ra">${withPrimary && P ? `<button class="tbtn" data-act="${P.act}" data-key="${esc(t.key)}" data-label="${esc(P.label)}">${esc(P.label)}</button>` : ""}${dots(t)}</span>`;
};

// ---- 데이터
async function load() {
  try {
    const r = await fetch("/api/data", { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    D = await r.json(); LIVE = true;
  } catch {
    LIVE = false;
    if (!window.PA_DATA) await new Promise(res => { const s = document.createElement("script"); s.src = "../data.js"; s.onload = s.onerror = res; document.head.appendChild(s); });
    D = window.PA_DATA || null;
  }
  if (D && new URLSearchParams(location.search).has("sample")) addSample(D);
  render();
}
// ?sample=1 — 지금은 비어 있는 칸(점수·시험·공지·작업)이 어디에 들어가는지 보기 위한 가짜 예시
function addSample(D) {
  const t0 = D.tasks.find(t => t.kind === "assignment") || D.tasks[0];
  D.grades = [{ course: "의약품분석학Ⅱ", title: "17강_퀴즈", score: 9, points: 10, graded_at: D.generated }];
  D.exams = [{ id: "x1", title: "생약학Ⅰ 기말고사", date: addDays(ymd(D.generated), 18), time: "10:00", course: "생약학Ⅰ", line: "기말고사는 12월 3일(목) 10시, 약대 2호관 201호" }];
  D.notices = [{ id: "n1", course: "약학윤리학 123456", title: "13주차 토의 일정 안내", summary: "토의 게시판 마감이 하루 늦춰짐" }];
  D.suggestions = t0 ? [{ key: t0.key, course: t0.course, title: t0.title, reason: "공지: 조장만 제출" }] : [];
  D.jobs = [{ status: "running", title: "보고서 초안 · 11주차 결과보고서", step: "자료 읽는 중", claude: 1 }];
}

function render() {
  if (!D) { $("eyebrow").textContent = "데이터 없음 — bin/pa run"; return; }
  const now = new Date(), today = ymdOf(now);
  document.querySelectorAll(".seg button").forEach(b => b.classList.toggle("on", b.dataset.view === view));
  $("liveDot").className = "live" + (LIVE ? "" : " off");
  const d = new Date(today + "T12:00:00");
  $("eyebrow").textContent = `${d.getMonth() + 1}월 ${d.getDate()}일 ${WD[d.getDay()]}요일 · ${pad(now.getHours())}:${pad(now.getMinutes())} · ${LIVE ? "실시간" : "보기 전용 (마지막 데이터)"}`;
  $("courses").innerHTML = (D.courses || []).map(c => `<option value="${esc(c)}">`).join("");

  // 한 줄 요약 — 상자(pill) 대신 글자로
  const open = D.tasks.filter(t => dt(t.due) >= now);
  const soon = open.filter(t => between(today, ymd(t.due)) <= 3);
  const leftMin = D.plan.filter(p => ymd(p.start) === today && dt(p.end) > now).reduce((s, p) => s + (dt(p.end) - Math.max(dt(p.start), now)) / 6e4, 0);
  const sl = D.slack ? D.slack.capacity - D.slack.need : null;
  $("summary").innerHTML = [`남은 할 일 <b class="num">${open.length}</b>`, `오늘 남은 계획 <b class="num">${dur(Math.round(leftMin))}</b>`,
    `3일 안 마감 <b class="num">${soon.length}</b>`,
    sl === null ? "" : `<span title="앞으로 7일: 쓸 수 있는 시간 ${dur(D.slack.capacity)} / 마감 7일 안 할 일 ${dur(D.slack.need)}">이번 주 ${sl < 0 ? `<b class="bad">부족 ${dur(-sl)}</b>` : `여유 <b>${dur(sl)}</b>`}</span>`]
    .filter(Boolean).join(" · ");

  $("view").innerHTML = view === "week" ? weekView(now, today) : todayView(now, today);
  $("title").textContent = view === "week" ? "주차별" : "오늘";
  $("more").innerHTML = moreHtml(now, today);
  $("pageFoot").textContent = `계획 ${stamp(D.plannedAt)} · Canvas ${stamp(D.canvasSynced)} · 시안 A (차분한 집중) — 버튼은 실제로 동작하지 않습니다`;
  document.querySelectorAll("details[data-k]").forEach(el => el.addEventListener("toggle", () => {
    el.open ? UI.open.add(el.dataset.k) : UI.open.delete(el.dataset.k);
  }));
}
const det = k => UI.open.has(k) ? "open" : "";

// ---- 오늘 보기
function todayView(now, today) {
  const rows = [
    ...D.busy.filter(b => ymd(b.start) === today).map(b => ({ busy: true, start: b.start, end: b.end, title: b.label })),
    ...D.plan.filter(p => ymd(p.start) === today).map(p => ({ start: p.start, end: p.end, t: findTask(p.key), summary: p.summary, kind: p.kind, why: p.why,
      part: (p.summary.match(/\((\d+\/\d+)\)$/) || [])[1] })),
  ].sort((a, b) => dt(a.start) - dt(b.start));
  let h = hero(rows, now, today) + checkHtml(now, today);

  // 타임라인
  h += `<section class="sec"><div class="sec-h"><h2>오늘 일정</h2><span class="aside">${D.dayStart}–${D.dayEnd}</span></div><div class="rows">`;
  let cursor = Math.max(dt(`${today}T${D.dayStart}:00`), now);
  const dayEnd = dt(`${today}T${D.dayEnd}:00`);
  const gap = (a, b) => (b - a) >= 30 * 6e4 ? `<div class="gap">빈 시간 ${hm(new Date(a).toISOString())}–${hm(new Date(b).toISOString())} · ${dur(Math.round((b - a) / 6e4))}</div>` : "";
  for (const r of rows) {
    const s = dt(r.start), e = dt(r.end);
    if (s > cursor) h += gap(cursor, s);
    if (e > cursor) cursor = e;
    const past = e <= now ? " past" : "", cur = s <= now && now < e ? " cur" : "";
    const tcol = `<span class="t num">${hm(r.start)}<small>${hm(r.end)}</small></span>`;
    if (r.busy) { h += `<div class="row busy${past}${cur}">${tcol}<span class="bmark"></span><div class="body"><div class="ttl">${esc(r.title)}</div><div class="meta">수업·약속</div></div><span></span></div>`; continue; }
    const t = r.t;
    h += `<div class="row${past}${cur}">${tcol}${t ? ck(t) : `<span></span>`}<div class="body" title="${esc(r.why || "")}">
        <div class="ttl">${t ? esc(t.title) : esc(clean(r.summary))}${r.part ? ` <span class="clip">(${r.part})</span>` : ""}${clip(t)}</div>
        ${t ? `<div class="meta">${[KIND[t.kind], t.course && esc(t.course), `마감 ${ddayText(t.due, today)} ${hm(t.due)}`].filter(Boolean).join(" · ")}</div>` : ""}</div>
      ${t && !past ? rowActs(t) : "<span></span>"}</div>`;
  }
  if (dayEnd > cursor) h += gap(cursor, dayEnd);
  if (!rows.length) h += `<p class="empty">오늘은 수업도 계획도 없습니다.</p>`;
  h += `</div>`;
  const tm = addDays(today, 1);
  h += `<p class="foot">내일 ${label(tm)} — 수업·약속 ${D.busy.filter(b => ymd(b.start) === tm).length} · 할 일 ${D.plan.filter(p => ymd(p.start) === tm).length}</p>`;
  if (D.todayDone.length) h += `<div class="foot">오늘 끝낸 일 ${D.todayDone.length}<div class="done-l">${D.todayDone.map(t => `<div>${esc(t.title)}</div>`).join("")}</div></div>`;
  h += `</section>`;
  return h + duesHtml(now, today);
}

function hero(rows, now, today) {
  if (D.active) {  // ⏱ 기록 중이면 그게 '지금'
    const a = D.active, t = findTask(a.key);
    return `<section class="hero"><div class="eyebrow">기록 중${a.estimate ? ` <span class="sep">·</span> 예상 ${dur(a.estimate)}` : ""}</div>
      <div class="hero-head">${t ? ck(t) : "<span></span>"}<div class="hero-body"><h2 class="hero-title">${esc(a.title)}</h2>
      <div class="timer-num" id="elapsed">0:00</div>
      <div class="hero-acts"><button class="btn primary" data-act="stopdone" data-label="끝내고 완료">✓ 끝내고 완료</button><button class="btn plain" data-act="stop" data-label="멈춤">멈춤</button></div></div></div></section>`;
  }
  const cur = rows.find(r => !r.busy && dt(r.start) <= now && now < dt(r.end));
  const next = rows.find(r => !r.busy && dt(r.start) > now);
  const pick = cur || next;
  let t = pick && pick.t, eyebrow, progress = "";
  if (t) {
    const left = Math.round((dt(pick.end) - now) / 6e4), until = Math.round((dt(pick.start) - now) / 6e4);
    eyebrow = cur ? `지금 <span class="sep">·</span> <span class="num">${hm(pick.start)}–${hm(pick.end)}</span> <span class="sep">·</span> ${dur(left)} 남음`
                  : `다음 <span class="sep">·</span> <span class="num">${hm(pick.start)}</span> 시작 <span class="sep">·</span> ${dur(until)} 뒤`;
    if (cur) progress = `<div class="bar" aria-hidden="true"><i style="width:${Math.min(100, Math.max(2, (now - dt(pick.start)) / (dt(pick.end) - dt(pick.start)) * 100)).toFixed(1)}%"></i></div>`;
  } else {
    t = D.tasks.filter(x => dt(x.due) >= now)[0];
    if (!t) return `<section class="hero"><div class="eyebrow">오늘 남은 계획 없음</div><h2 class="hero-title" style="margin-top:8px">쉬어도 됩니다</h2></section>`;
    eyebrow = `오늘 남은 계획 없음 <span class="sep">·</span> 가장 급한 일`;
  }
  const P = primaryOf(t);
  return `<section class="hero"><div class="eyebrow">${eyebrow}</div>
    <div class="hero-head">${ck(t)}<div class="hero-body">
      <h2 class="hero-title">${esc(t.title)}${pick && pick.part ? ` <span class="clip">(${pick.part})</span>` : ""}</h2>
      <div class="hero-meta">${[KIND[t.kind], t.course && esc(t.course), `마감 ${label(ymd(t.due))} ${hm(t.due)} (${ddayText(t.due, today)})`, links(t).length && `자료 ${links(t).length}`].filter(Boolean).join(" · ")}</div>
      ${progress}
      <div class="hero-acts"><button class="btn primary" data-act="${P.act}" data-key="${esc(t.key)}" data-label="${esc(P.label)}">${esc(P.label)}</button>
        <button class="btn plain" data-act="done" data-key="${esc(t.key)}" data-label="완료">✓ ${t.kind === "lecture" ? "들었음" : "완료"}</button>
        <button class="icon-btn" data-menu="${esc(t.key)}" title="다른 동작" aria-label="다른 동작">⋯</button></div>
      ${pick && pick.why ? `<p class="why">왜 지금? ${esc(pick.why)}</p>` : ""}</div></div></section>`;
}

// ---- 확인할 것: 알림·점수·시험·공지·작업·파일·브리핑을 한 줄로 접는다
function checkHtml(now, today) {
  const G = [], hint = [];
  let n = 0;
  const warns = [...D.warnings];
  if (!LIVE) warns.unshift("엔진이 꺼져 있어 마지막 데이터를 보여 주는 중입니다. VSCode 에서 'Ctrl+Shift+P → 작업 실행 → 비서: 자동 감시'.");
  if (warns.length) {
    n += warns.length; hint.push(`알림 ${warns.length}`);
    G.push(`<div class="cgrp"><h3 class="cgrp-h">알림</h3>${warns.map(w => {
      const txt = esc(w.replace(/\s*\[ack:\w+\]/, "").replace(/\s*\[keep=[^\]]+\]/, "")).replace(/`([^`]+)`/g, "<code>$1</code>");
      const b = [];
      if (w.includes("로그인 필요")) b.push(`<button class="tbtn" data-act="relogin" data-label="다시 로그인 (직접 누를 때만)">다시 로그인</button>`);
      if (w.includes("Google Calendar 로그인")) b.push(`<button class="tbtn" data-act="glogin" data-label="Google 다시 로그인">Google 로그인</button>`);
      if (w.includes("[keep=")) b.push(`<button class="tbtn gray" data-act="keep" data-label="계속 보이기">보이기</button>`);
      if (w.includes("[ack:")) b.push(`<button class="tbtn gray" data-act="ack" data-label="확인">확인</button>`);
      return `<div class="citem"><span class="tx">${txt}</span><span class="ac">${b.join("")}</span></div>`;
    }).join("")}</div>`);
  }
  const gr = D.grades || [];
  if (gr.length) {
    n += gr.length; hint.push(`새 점수 ${gr.length}`);
    G.push(`<div class="cgrp"><h3 class="cgrp-h">새 점수 <button class="tbtn gray" data-act="gradeack" data-label="점수 확인">확인</button></h3>${gr.map(g => `<div class="citem"><span class="tx">${esc(g.title)}<small>${esc(g.course)}</small></span><span class="num"><b>${g.score}</b> / ${g.points}</span></div>`).join("")}</div>`);
  }
  const ex = D.exams || [];
  if (ex.length) {
    n += ex.length; hint.push(`시험 후보 ${ex.length}`);

      ${ns.map(x => `<div class="citem"><span class="tx">${esc(x.title)}<small>${esc(String(x.course).replace(/\s*\d{6}$/, ""))}${x.summary ? " · 요약: " + esc(x.summary) : ""}</small></span>
        <span class="ac"><button class="tbtn" data-act="nopen" data-label="공지 열기">열기</button><button class="tbtn gray" data-act="nread" data-label="읽음">읽음</button></span></div>`).join("")}
      ${ns.length ? `<button class="tbtn" data-act="njob" data-label="공지 요약·제외 후보 찾기 (Claude)" style="padding-left:0">요약·제외 후보 찾기 <span class="small" style="font-weight:400">Claude 사용</span></button>` : ""}
      ${sg.map(x => `<div class="citem"><span class="tx">제외 후보 · ${esc(x.course)} ${esc(x.title)}<small>${esc(x.reason)}</small></span>
        <span class="ac"><button class="tbtn" data-act="ignore-one" data-label="제외">제외</button><button class="tbtn gray" data-act="sgno" data-label="아니요">아니요</button></span></div>`).join("")}</div>`);
  }

    G.push(`<div class="cgrp"><h3 class="cgrp-h">에이전트 작업</h3>${js.map(j => `<div class="citem"><span class="tx"><b>${ST[j.status] || j.status}</b> · ${esc(j.title)}
      <small>${j.status === "failed" ? esc(j.error) : esc(j.step)}${j.claude ? " · Claude 사용 " + j.claude + "회" : ""}</small></span>
      ${j.status === "done" && j.result ? `<span class="ac"><button class="tbtn" data-act="openfile" data-label="결과 열기">열기</button></span>` : ""}</div>`).join("")}</div>`);
  }
  const dls = D.downloads || [];
  if (dls.length) {
    n += dls.length; hint.push(`새 파일 ${dls.length}`);
    const shown = UI.allDl ? dls : dls.slice(0, 3);
    G.push(`<div class="cgrp"><h3 class="cgrp-h">새로 받은 파일 ${dls.length} <span class="small" style="font-weight:400">과목 폴더로 정리</span></h3>${shown.map(f => `<div class="citem"><span class="tx">${esc(f.name)}</span>
      <span class="ac"><select class="dl-sel" aria-label="과목">${["", ...(D.courseFolders || [])].map(c => `<option ${c === f.course ? "selected" : ""}>${esc(c || "과목?")}</option>`).join("")}</select>
      <button class="tbtn" data-act="dlmove" data-label="파일 옮기기">옮기기</button><button class="tbtn gray" data-act="dlskip" data-label="파일 무시" aria-label="무시">무시</button></span></div>`).join("")}
      ${dls.length > 3 ? `<button class="link" data-ui="alldl">${UI.allDl ? "접기" : `${dls.length - 3}개 더 보기`}</button>` : ""}</div>`);
  }
  // 브리핑 / 마무리 — 카드 대신 이 안의 한 묶음
  const evening = `${pad(now.getHours())}:${pad(now.getMinutes())}` >= D.eveningReview;
  const todayPlan = D.plan.filter(p => ymd(p.start) === today), tm = addDays(today, 1);
  const li = [];
  if (evening) {
    const missed = todayPlan.filter(p => dt(p.end) <= now).map(p => findTask(p.key)).filter(t => t && t.status === "open");
    const worked = D.sessionsToday.reduce((s, x) => s + (x.minutes || 0), 0);
    const first = [...D.busy.filter(b => ymd(b.start) === tm), ...D.plan.filter(p => ymd(p.start) === tm)].sort((a, b) => dt(a.start) - dt(b.start))[0];
    li.push(`오늘 끝낸 일 ${D.todayDone.length}${D.todayDone.length ? ": " + D.todayDone.map(t => esc(t.title)).join(", ") : ""}`);

    li.push(`내일 ${label(tm)} 첫 일정 ${first ? `${hm(first.start)} ${esc(first.label || clean(first.summary))}` : "없음"}`);
  } else {
    const cls = D.busy.filter(b => ymd(b.start) === today), m = todayPlan.reduce((s, p) => s + (dt(p.end) - dt(p.start)) / 6e4, 0);
    li.push(`수업·약속 ${cls.length}개${cls.length ? " (" + cls.map(b => `${hm(b.start)} ${esc(b.label)}`).join(", ") + ")" : ""}`);

    if (rest.length) li.push(`쉬려던 요일에 잡힌 것 ${rest.length}개 (마감 때문에): ${rest.map(p => `${label(ymd(p.start))} ${esc(clean(p.summary))}`).join(", ")}`);
    const soon2 = D.tasks.filter(t => dt(t.due) >= now && between(today, ymd(t.due)) <= 2);
    if (soon2.length) li.push(`이틀 안 마감 ${soon2.length}개`);
  }
  if (D.quiz && D.quiz.stale) li.push(`퀴즈 기록을 ${D.quiz.backupAt ? label(ymd(D.quiz.backupAt)) + " 이후로" : "아직"} 가져오지 않았어요 — 퀴즈 앱에서 [기록 내보내기] <button class="tbtn" data-act="openquiz" data-label="퀴즈 앱 열기">퀴즈 앱 열기</button>`);
  if (evening && now.getDay() === 0 && D.weekReview) li.push(`이번 주 돌아보기 — 아래 '통계'에 있음`);
  G.push(`<div class="cgrp"><h3 class="cgrp-h">${evening ? "하루 마무리" : "오늘 브리핑"}<button class="tbtn gray" data-act="ritualclose" data-label="${evening ? "마무리" : "오늘 시작"}">${evening ? "마무리" : "오늘 시작"}</button></h3>
    <ul class="clist">${li.map(x => `<li>${x}</li>`).join("")}</ul>
    ${D.recent.length ? `<h3 class="cgrp-h" style="margin-top:12px">지난 하루 동안 바뀐 것 ${D.recent.length}</h3><ul class="clist">${D.recent.map(r => `<li>${esc(String(r.label).replace(/^\S+\s/, ""))} · ${esc(r.name)}</li>`).join("")}</ul>` : ""}</div>`);
  hint.push(evening ? "하루 마무리" : "오늘 브리핑");
  return `<details class="check" data-k="check" ${det("check")}><summary><span class="cnt ${D.warnings.some(w => w.includes("로그인")) ? "hot" : ""} num">${n}</span>
    <span class="ttl">확인할 것</span><span class="hint">${hint.join(" · ")}</span><span class="chev">›</span></summary>
    <div class="check-body">${G.join("")}</div></details>`;
}

// ---- 다가오는 마감: 3일만, 나머지는 '2주 보기'
function duesHtml(now, today) {
  const open = D.tasks.filter(t => dt(t.due) >= now), late = D.tasks.filter(t => dt(t.due) < now);
  const span = UI.allDues ? 14 : 4;  // 오늘 + 3일
  const hidden = open.filter(t => between(today, ymd(t.due)) >= span && between(today, ymd(t.due)) < 14).length;
  const row = (t, lateRow) => `<div class="row nt">${ck(t)}<div class="body"><div class="ttl">${esc(t.title)}${clip(t)}</div>
    <div class="meta">${lateRow ? `<span class="late">${label(ymd(t.due))} ${hm(t.due)} 지남</span>` : `<span class="num">${hm(t.due)}</span>`}${t.course ? " · " + esc(t.course) : ""} · ${KIND[t.kind]}</div></div>${rowActs(t)}</div>`;
  let h = `<section class="sec"><div class="sec-h"><h2>다가오는 마감</h2><span class="aside">${UI.allDues ? "2주" : "앞으로 3일"}</span>
    <button class="link" data-ui="alldues">${UI.allDues ? "3일만 보기" : hidden ? `2주 보기 (+${hidden})` : "2주 보기"}</button></div><div class="rows">`;
  if (late.length) h += `<div class="day-h danger">지난 마감 <span class="d">${late.length}개 · 아직 안 끝남</span></div>` + late.map(t => row(t, true)).join("");
  let any = false;
  for (let i = 0; i < span; i++) {
    const d = addDays(today, i), its = open.filter(t => ymd(t.due) === d);
    if (!its.length) continue;
    any = true;
    h += `<div class="day-h ${i === 0 ? "today" : ""}">${relDay(d, today) || "D-" + i} <span class="d">${label(d)} · ${its.length}개</span></div>` + its.map(t => row(t)).join("");
  }
  if (!any && !late.length) h += `<p class="empty">${UI.allDues ? "2주" : "3일"} 안 마감 없음</p>`;
  return h + `</div></section>`;
}

// ---- 주차별 (간단히: 날짜별 목록)
function curWeekIdx(today) {
  const ws = D.semester || [];
  const i = ws.findIndex(w => w.start <= today && today <= addDays(w.start, 6));
  return i >= 0 ? i : (ws.length && today < ws[0].start ? 0 : ws.length - 1);
}
function weekView(now, today) {
  const ws = D.semester || [];
  if (!ws.length) return `<p class="empty">학기 정보가 없습니다.</p>`;
  const cur = curWeekIdx(today), i = wkIdx === null ? cur : Math.max(0, Math.min(ws.length - 1, wkIdx));
  const w = ws[i], days = [...Array(7)].map((_, k) => addDays(w.start, k)), maxMin = Math.max(60, ...ws.map(x => x.minutes));
  let h = `<section class="hero" style="margin-top:32px"><div class="wk-nav"><button class="icon-btn" data-wk="${i - 1}" ${i === 0 ? "disabled" : ""} aria-label="이전 주">‹</button>
    <b>${i + 1}주차</b><span class="r num">${label(w.start)} – ${label(days[6])}</span><button class="icon-btn" data-wk="${i + 1}" ${i === ws.length - 1 ? "disabled" : ""} aria-label="다음 주">›</button>
    ${i !== cur ? `<button class="link push" data-wk="${cur}">이번 주로</button>` : `<span class="r push">이번 주</span>`}</div>
    <div class="strip">${ws.map((x, j) => `<button class="sw ${j === i ? "sel" : ""} ${j === cur ? "cur" : ""} ${j < cur ? "past" : ""} ${x.items.some(y => y.exam) ? "ex" : ""}" data-wk="${j}"
      title="${j + 1}주차 · 마감 ${x.items.length}개 · 남은 일 ${dur(x.minutes)}"><em></em><i style="height:${Math.max(3, Math.round(x.minutes / maxMin * 32))}px"></i><span>${j + 1}</span></button>`).join("")}</div>
    <p class="strip-note">막대 = 그 주에 남은 일의 양 · 빨간 점 = 시험</p></section>`;

  h += `<section class="sec"><div class="sec-h"><h2>날짜별 일정</h2><span class="aside">계획은 2주 앞까지</span></div><div class="rows">`;
  for (const d of days) {

    const rd = relDay(d, today), dd = new Date(d + "T12:00:00");

    for (const p of items) {

      if (p.busy) { h += `<div class="row busy${past}">${tcol}<span class="bmark"></span><div class="body"><div class="ttl">${esc(p.label)}</div></div><span></span></div>`; continue; }
      const t = findTask(p.key);
      h += `<div class="row${past}${curC}">${tcol}${t ? ck(t) : "<span></span>"}<div class="body" title="${esc(p.why || "")}"><div class="ttl">${esc(t ? t.title : clean(p.summary))}${clip(t)}</div>
        <div class="meta">${t ? [KIND[t.kind], t.course && esc(t.course), "마감 " + ddayText(t.due, today)].filter(Boolean).join(" · ") : ""}</div></div>${t && !past ? rowActs(t) : "<span></span>"}</div>`;
    }

  const its = w.items, openIts = its.filter(x => x.status === "open"), doneIts = its.filter(x => x.status === "done");
  h += `<section class="sec"><div class="sec-h"><h2>이 주에 마감</h2><span class="aside">${openIts.length}개 남음 / 전체 ${its.length}개</span></div><div class="rows">`;
  for (const [kind, name] of [["lecture", "강의"], ["assignment", "과제"], ["quiz", "퀴즈"], ["review", "퀴즈 복습"], ["todo", "할 일"]]) {
    const g = openIts.filter(x => x.kind === kind).sort((a, b) => dt(a.due) - dt(b.due));
    if (!g.length) continue;
    h += `<div class="day-h">${name} <span class="d">${g.length}</span></div>` + g.map(x => {

        <div class="meta">${x.course ? esc(x.course) + " · " : ""}마감 ${label(ymd(x.due))} ${hm(x.due)} · ${late ? `<span class="late">지남</span>` : ddayText(x.due, today)}${x.minutes ? " · 예상 " + dur(x.minutes) : ""}</div></div>${rowActs(x)}</div>`;
    }).join("");
  }
  if (!its.length) h += `<p class="empty">이 주에 마감인 것이 없습니다.</p>`;
  if (doneIts.length) h += `<details data-k="wkdone" ${det("wkdone")} style="margin-top:8px"><summary class="small"><span class="chev">›</span> 끝낸 것 ${doneIts.length}개</summary>
    <div class="done-l" style="padding-left:20px">${doneIts.map(x => `<div>${esc(x.title)}</div>`).join("")}</div></details>`;
  return h + `</div></section>`;
}

function statsHtml(today) {
  const days14 = [...Array(14)].map((_, i) => addDays(today, i));
  const planMin = d => D.plan.filter(p => ymd(p.start) === d).reduce((s, p) => s + mins(p.end) - mins(p.start), 0);
  const maxLoad = Math.max(D.cap, ...days14.map(planMin));
  const tick = (d, i) => i % 2 ? "&nbsp;" : `${+d.slice(5, 7)}/${+d.slice(8)}`;
  const load = `<div class="bars"><div class="cap" style="bottom:${D.cap / maxLoad * 100}%" title="하루 한도 ${dur(D.cap)}"></div>${days14.map((d, i) => { const m = planMin(d);
    return `<div class="b ${m > D.cap ? "over" : ""}" title="${label(d)} ${dur(m)}"><i style="height:${m / maxLoad * 100}%"></i><span>${tick(d, i)}</span></div>`; }).join("")}</div>`;
  const past14 = [...Array(14)].map((_, i) => addDays(today, i - 13)), maxDone = Math.max(1, ...past14.map(d => D.doneByDay[d] || 0));
  const trend = `<div class="bars">${past14.map((d, i) => `<div class="b" title="${label(d)} ${D.doneByDay[d] || 0}건"><i style="height:${(D.doneByDay[d] || 0) / maxDone * 100}%"></i><span>${tick(d, i)}</span></div>`).join("")}</div>`;
  const prog = D.progress.map(p => `<div class="prog"><div class="r"><span>${esc(p.course)}</span><span class="num">${p.done}/${p.total}</span></div><div class="tr"><i style="width:${p.total ? p.done / p.total * 100 : 0}%"></i></div></div>`).join("") || `<p class="empty">아직 없음</p>`;
  const ses = D.sessionsToday.length ? D.sessionsToday.map(s => { const t = findTask(s.key); return `<div class="citem"><span class="tx">${hm(s.start)}${s.end ? "–" + hm(s.end) : " (진행 중)"} ${esc(t ? t.title : s.key)}</span><span class="small">${s.minutes ? dur(s.minutes) : ""}</span></div>`; }).join("")
    : `<p class="small">⏱ 시간 재기로 기록하면 여기에 쌓이고, 쌓인 기록으로 예상 시간을 고칩니다.</p>`;
  const cal = (D.calibration || []).length ? D.calibration.map(c => `<div class="citem"><span class="tx">${esc(c.what)}</span><span class="small">예상의 ×${c.factor} (${c.n}번)</span></div>`).join("")
    : `<p class="small">같은 종류가 3번 기록되면 계획에 반영됩니다.</p>`;
  const q = D.quiz || {};
  const quiz = `<p class="small" style="margin:0">마지막으로 가져온 기록: ${q.backupAt ? stamp(q.backupAt) : "없음"}${q.stale ? " (오래됨)" : ""}</p>${Object.entries(q.dueBySubject || {}).map(([s, n]) => `<div class="citem"><span class="tx">${esc(s)}</span><span class="small">복습 ${n}</span></div>`).join("")}
    <button class="tbtn" data-act="openquiz" data-label="퀴즈 앱 열기" style="padding-left:0">퀴즈 앱 열기</button>`;
  const W = D.weekReview;
  const wr = W ? `<ul class="clist"><li>끝낸 일 <b>${W.doneTotal}</b>${W.doneTotal ? " (" + Object.entries(W.done).map(([k, n]) => `${KIND[k] || k} ${n}`).join(", ") + ")" : ""}</li>
    <li>기록 ${W.trackedCount ? `${W.trackedCount}번 · 실제 ${dur(W.trackedMinutes)} / 예상 ${dur(W.trackedEstimate)}` : "없음"}</li>
    <li>${W.missed.length ? `놓친 마감 ${W.missed.length}: ${W.missed.map(m => esc(m.title)).join(", ")}` : "놓친 마감 없음"}</li>
    <li>다음 주 마감 ${W.nextCount}개 · 예상 ${dur(W.nextMinutes)}${W.nextExams.length ? " · 시험 " + W.nextExams.map(esc).join(", ") : ""}</li></ul>` : `<p class="empty">아직 없음</p>`;
  const S = (t, s, b) => `<div class="stat"><h3>${t} <small>${s}</small></h3>${b}</div>`;
  return `<div class="stats">${S("일별 학습량", "계획 · 점선 = 하루 한도", load)}${S("완료 추이", "14일", trend)}${S("과목별 진행", "추적한 항목 중 완료", prog)}
    ${S("이번 주 돌아보기", "월요일부터", wr)}${S("오늘 실제로 한 시간", "기록", ses)}${S("예상 시간 보정", "기록 3번 이상부터", cal)}${S("퀴즈 복습", "기록 내보내기 기준", quiz)}</div>`;
}

// ---- ⋯ 메뉴
function openMenu(btn, key) {
  const t = findTask(key), m = $("menu");
  if (!t) return;
  UI.menuKey = key;
  fillMenu(t);
  m.hidden = false;
  const r = btn.getBoundingClientRect(), W = m.offsetWidth, H = m.offsetHeight;
  let left = Math.min(window.innerWidth - W - 16, Math.max(16, r.right - W)), top = r.bottom + 4;
  if (top + H > window.innerHeight - 16) top = Math.max(16, r.top - H - 4);
  m.style.left = left + "px"; m.style.top = top + "px";
  m.querySelector("button").focus({ preventScroll: true });
}
function fillMenu(t) {
  $("menu").innerHTML = `<div class="mh">${esc(t.title)}</div>` + menuItems(t).map(g => g.map(x =>
    `<button role="menuitem" class="${x.strong ? "strong" : ""} ${x.danger ? "danger" : ""}" data-act="${x.act}" data-key="${esc(t.key)}" data-label="${esc(x.label)}">${esc(x.label)}${x.hint ? `<small>${esc(x.hint)}</small>` : ""}</button>`).join("")).join("<hr>");
}
function closeMenu() { $("menu").hidden = true; UI.menuKey = null; }
function ignoreMenu(key) {  // 제외: 이것만 / 앞으로도
  const t = findTask(key);
  $("menu").innerHTML = `<div class="mh">제외 — ${esc(t ? t.title : "")}</div>
    <button data-act="ign-one" data-label="이것만 제외">이것만<small>이 과제 하나</small></button>
    <button data-act="ign-all" data-label="앞으로도 제외">앞으로도<small>같은 이름 계속</small></button><hr>
    <button data-menu="${esc(key)}">취소</button>`;
}

// ---- 시트 (보고서 작성 창 · 자료 창): 화면을 밀어내지 않고 위에 뜬다
function openSheet(html) { $("sheet").innerHTML = html; $("scrim").hidden = false; $("sheet").querySelector("button,textarea,input")?.focus({ preventScroll: true }); }
function closeSheet() { $("scrim").hidden = true; }
const sheetTop = (title, sub) => `<div class="sh-top"><h3>${esc(title)}</h3><button class="icon-btn" data-ui="sheetclose" aria-label="닫기">✕</button></div>${sub ? `<p class="small" style="margin:4px 0 0">${sub}</p>` : ""}`;
function reportSheet(t) {
  const today = ymdOf(new Date());
  openSheet(sheetTop(t.title, `${t.course ? esc(t.course) + " · " : ""}마감 ${t.due ? `${label(ymd(t.due))} ${hm(t.due)} (${ddayText(t.due, today)})` : "없음"}`)
    + `<details style="margin-top:16px"><summary class="small"><span class="chev">›</span> Canvas 과제 설명</summary><p class="small">실제 화면에서는 여기에 Canvas 설명을 불러옵니다 (시안이라 읽지 않음).</p></details>
    <p class="small" style="margin:8px 0 0">참고 자료: ${links(t).length ? links(t).map(esc).join(", ") : "연결 없음 — 자료 창에서 고르기"} <button class="link" data-act="mat" data-key="${esc(t.key)}" data-label="자료">자료 고르기</button></p>
    <textarea placeholder="어떻게 쓸까요? (분량·구성·강조할 내용·내 의견·말투 — 비워도 됨)" aria-label="작성 지침"></textarea>
    <label class="small"><input type="checkbox" checked> 내 생각·경험이 들어갈 자리는 비워 두기</label>
    <div class="ways"><button class="primary" data-act="repchat" data-label="채팅에서 같이 쓰기">채팅에서 같이 쓰기<small>보고서 파일을 VSCode 에 열고, 요청을 복사 → Claude 채팅에 붙여 넣기</small></button>
      <button data-act="repdraft" data-label="초안 한 번에 만들기">초안 한 번에 만들기<small>Claude 가 뒤에서 전체 초안 (구독 사용, 몇 분)</small></button>
      <button data-act="repwin" data-label="VSCode 작업 창">VSCode 작업 창 열기<small>report 폴더를 새 창으로 + 보고서 파일</small></button>
      <button data-act="repfile" data-label="빈 파일만 만들기">빈 파일만 만들고 열기<small>이름·제목·학번 줄만. Claude 안 씀</small></button>
      <button data-act="reppdf" data-label="PDF 만들기">PDF 만들기 · 위치 보기<small>파일이 있을 때 — A4 쪽수 확인</small></button></div>`);
}
function matSheet(t) {
  const ls = links(t);
  openSheet(sheetTop("자료 — " + t.title, `연결된 자료 ${ls.length}개 · 보고서·내용정리가 이것만 참고`)
    + (ls.length ? `<div class="lchips">${ls.map(n => `<button class="lchip" data-act="openfile" data-label="자료 열기" title="${esc(n)}">${esc(n)}</button>`).join("")}</div>` : "")
    + `<input class="field" type="text" style="width:100%;margin-top:16px" placeholder="자료 찾기 — 예) 17강 배포 · 자료/ 처럼 / 로 폴더" aria-label="자료 찾기">
    <p class="small">시안이라 파일 목록은 읽지 않습니다. 실제 화면: 추천 · 실시간 찾기 · 폴더 둘러보기 · 다운로드에서 찾기.</p>
    <div class="ways"><button data-act="mpbrowse" data-label="폴더 둘러보기">폴더 둘러보기</button><button data-act="quizcopy" data-key="${esc(t.key)}" data-label="퀴즈 요청 복사">퀴즈 요청 복사<small>연결된 자료로 — 채팅에 붙여 넣기</small></button></div>`);
}

// ---- 알림 띠
function toast(text, ms = 2600) {
  const el = $("toast"); el.textContent = text; el.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => { el.hidden = true; }, ms);
}
const fake = what => toast(`시안: '${what}' — 실제 동작은 하지 않음`);

// ---- 입력
if (matchMedia("(max-width: 600px)").matches) $("quickInput").placeholder = "새 할 일 — 예) 발표 @금 18시 ~2h";
$("days").innerHTML = ["월", "화", "수", "목", "금", "토", "일"].map((d, i) => `<label><input type="checkbox" value="${i}"><span>${d}</span></label>`).join("");
$("fullToggle").addEventListener("click", () => { const f = $("addForm"); f.hidden = !f.hidden; $("fullToggle").textContent = f.hidden ? "자세히" : "접기"; });
document.querySelectorAll("[data-day]").forEach(b => b.addEventListener("click", () => {
  const f = $("addForm"), v = b.dataset.day, d = new Date();
  if (v === "clear") { f.date.value = ""; f.time.value = ""; return; }
  if (v === "fri") d.setDate(d.getDate() + ((5 - d.getDay() + 7) % 7)); else d.setDate(d.getDate() + +v);
  f.date.value = ymdOf(d);
}));
$("quickForm").addEventListener("submit", e => { e.preventDefault(); fake("할 일 추가"); });
$("addForm").addEventListener("submit", e => { e.preventDefault(); fake("할 일 추가 (자세히)"); });
document.addEventListener("submit", e => { if (e.target.dataset.form === "someday") { e.preventDefault(); fake("하고 싶은 일 추가"); } });

document.addEventListener("click", e => {
  const tab = e.target.closest("[data-view]");
  if (tab) { view = tab.dataset.view; try { localStorage.setItem("pa.a.view", view); } catch {} closeMenu(); render(); return; }
  const wk = e.target.closest("[data-wk]");
  if (wk) { if (!wk.disabled) { wkIdx = +wk.dataset.wk; render(); } return; }
  const mb = e.target.closest("[data-menu]");
  if (mb) {
    if ($("menu").contains(mb)) { fillMenu(findTask(mb.dataset.menu)); return; }  // 제외 → 취소: 같은 자리에서 원래 목록으로
    if (UI.menuKey === mb.dataset.menu && !$("menu").hidden) closeMenu(); else openMenu(mb, mb.dataset.menu);
    return;
  }
  const ui = e.target.closest("[data-ui]");
  if (ui) {
    const u = ui.dataset.ui;
    if (u === "alldues") UI.allDues = !UI.allDues;
    if (u === "alldl") UI.allDl = !UI.allDl;
    if (u === "sheetclose") { closeSheet(); return; }
    render(); return;
  }
  if (e.target === $("scrim")) { closeSheet(); return; }
  const b = e.target.closest("[data-act]");
  if (!b) { if (!$("menu").contains(e.target)) closeMenu(); return; }
  const act = b.dataset.act, key = b.dataset.key, t = findTask(key);
  if (act === "ignore") { ignoreMenu(key); return; }
  if (act === "report" && t) { closeMenu(); reportSheet(t); return; }
  if (act === "mat" && t) { closeMenu(); matSheet(t); return; }
  if (act === "done" && b.classList.contains("ck")) { b.classList.add("on"); setTimeout(() => b.classList.remove("on"), 700); }
  closeMenu();
  fake(b.dataset.label || b.textContent.trim());
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { closeMenu(); closeSheet(); return; }
  const typing = /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName);
  if ((e.key === "k" && (e.ctrlKey || e.metaKey)) || (e.key === "/" && !typing)) { e.preventDefault(); $("quickInput").focus(); return; }
  if (typing || !D) return;
  if (e.key === "t" || e.key === "w") { view = e.key === "t" ? "today" : "week"; render(); }
  if (view === "week" && (e.key === "ArrowLeft" || e.key === "ArrowRight")) {
    const base = wkIdx === null ? curWeekIdx(ymdOf(new Date())) : wkIdx;
    wkIdx = Math.max(0, Math.min((D.semester || []).length - 1, base + (e.key === "ArrowLeft" ? -1 : 1))); render();
  }
});
window.addEventListener("resize", closeMenu);
window.addEventListener("scroll", closeMenu, { passive: true });

function tickTimer() {
  const el = $("elapsed");
  if (!el || !D || !D.active) return;
  const s = Math.max(0, Math.floor((Date.now() - dt(D.active.start)) / 1000));
  el.textContent = `${Math.floor(s / 3600) ? Math.floor(s / 3600) + ":" : ""}${pad(Math.floor(s / 60) % 60)}:${pad(s % 60)}`;
}
load();
setInterval(() => {  // 30초마다 새 데이터 — 메뉴·시트를 보고 있거나 입력 중이면 건너뜀
  if ($("menu").hidden && $("scrim").hidden && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) load();
}, 30000);
setInterval(tickTimer, 1000);
</script>
</body>
</html>
