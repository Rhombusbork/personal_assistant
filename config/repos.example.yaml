# 켤 때 내려받을 내 git 저장소 — 견본. bin/setup 이 config/repos.yaml 로 복사한다 (내 파일은 git 에 안 올라감).
# 엔진이 켜질 때 한 번, 각 폴더의 지금 브랜치를 GitHub(원격)과 대조해 새 커밋이 있으면 받는다 (bin/pa pull 로 직접도).
# 휴대폰·클라우드에서 바꾼 기록이 PC 에도 들어오게 하려는 것. 올리지(push)는 않는다.
