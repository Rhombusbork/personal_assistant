# 자료 연결 (📄 자료 창) — 찾기 범위와 규칙.
# 프로그램은 이 파일을 읽기만 한다. 범위·개수·기간을 바꾸려면 채팅에서 요청 (규칙 변경은 대화로).
roots:                          # 찾기·📁 둘러보기 범위 (파일 이름만 읽음)
  - name: 자료
    path: ~/study_system/materials
    ext: [pdf, ppt, pptx, doc, docx, hwp, hwpx, xlsx, md, txt]
  - name: 노트
    path: ~/study_system/notes
    ext: [md, txt]
  - name: 보고서
    path: ~/report
    ext: [md, pdf, docx, hwp, hwpx]
skip: ["스크린샷", "Screenshot"]  # 이름에 이게 들어간 파일·폴더는 빼기 (.으로 시작하는 것도 뺌)
downloads:                      # [📥 다운로드에서도 찾기] 를 눌렀을 때만
  recent_days: 7                # 최근 며칠 안에 받은 것만
  ext: [pdf, ppt, pptx, doc, docx, hwp, hwpx, xlsx, txt, md, zip]
  on_link: move                 # move = 그 과목 자료 폴더로 옮긴 뒤 연결
max_links: 10                   # 할 일 하나에 연결할 수 있는 자료 수 (보고서·내용정리가 참고하는 수)
