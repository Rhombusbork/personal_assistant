# 수업 시간표 (매주 반복) — 견본. bin/setup 이 config/timetable.yaml 로 복사한다 (내 파일은 git 에 안 올라감).
# 학기 시작·끝 (학사일정 보고 바꾸기)
semester_start: "2026-09-01"
semester_end: "2026-12-21"

# 대면 수업: day 는 mon tue wed thu fri sat sun
classes:
  - name: 예시과목
    day: mon
    start: "09:00"
    end: "10:15"

# 온라인 수업 (Canvas 과목명과 같게, 시간 고정 없음 → 정기 할 일로 관리)
online_classes: []

# (선택, 제주대) 학교 포털(하영드리미)의 내 시간표를 매주 읽어 '수업 시간표' 캘린더에 날짜별로 (휴강 빼고 보강 넣음).
# .env 의 PA_SCHOOL_ID·PA_SCHOOL_PW 로 로그인. 켜면 위 classes 와 bin/pa sync-timetable 대신 이것을 쓴다.
# 포털은 온라인 과목에도 강의실을 적어 두므로, 대면 과목은 offline 에 포털 과목명 그대로 적는다 (그 밖은 온라인).
portal:
  enabled: false
  offline: []                       # 대면 (예: 약품생화학Ⅰ)
  online: []                        # 온라인으로 확인한 과목 (처음 보는 과목 경고를 끄려고)

# 학습 계획 설정
planner:
  main_days: [mon, wed, fri, sat]   # 우선 배치 요일
  fallback_days: [sun]              # 위 요일로 부족하면 사용
  day_start: "09:00"
  day_end: "23:00"
  break_minutes: 10                 # 항목 사이 휴식
  split_over: 120                   # 이보다 큰 일(분)은 나눠서 여러 날에
  chunk_minutes: 90                 # 나눈 한 조각의 최대 길이
  exam_review:                      # 제목에 "시험"·"고사"가 있는 할 일 → 시험 전 복습 블록
    offsets: [7, 4, 2]              # 시험 며칠 전부터 (각 이틀 안에)
    minutes: 60
  horizon_days: 14                  # 이 기간 안에 마감인 항목만 계획
  max_minutes_per_day: 240         # 하루 최대 학습 배치 시간
  evening_review: "21:00"           # 이 시각 이후 대시보드에 '하루 마무리'
  minutes:                          # 기본 예상 소요 시간 (항목별로 `pa.tasks time` 으로 조정)
    lecture: 50
    quiz: 20
    assignment: 60

# 대시보드 창 — mode: vscode = VSCode 안 탭 (비서 확장 필요: bin/pa vscode-ext). 저절로 열지 않고
#   탭 줄 오른쪽 위 ✓ 버튼 · 상태 줄 '비서' · Ctrl+Alt+D 로 연다
#                  app    = 주소창 없는 Edge 앱 창 (bin/pa open)
dashboard:
  mode: vscode

# Canvas 전체 확인 (새 과제·마감 변경·공지·강의 자료). 비서를 켤 때는 항상 하고, 켜 둔 동안은 이 간격마다 (0 이면 대시보드 ⟳ 누를 때만)
canvas:
  check_every_hours: 3

# 휴대폰 알림 — 비서가 Google Calendar 일정에 붙이는 알림 (휴대폰 Google Calendar 앱이 알려 줌, PC 꺼져도 됨)
# 계획 시간 자동 열기 — '학습 계획' 블록이 시작되면 PC 가 그 일을 열어 준다 (PC 가 켜져 있을 때만, pa/autoopen.py).
#   강의 → 강의 페이지 / 퀴즈 → 퀴즈 페이지 / 과제 → 초안 파일·탐색기·제출 페이지. 블록이 끝나면 수강·제출을 바로 확인.
#   시청·풀이는 직접, 제출은 아래 auto_submit 대상만 자동.
#   PC 가 꺼져 있으면 휴대폰에 캘린더 알림만 (reminders.plan_minutes_before 에 0 을 넣으면 '시작할 때' 알림)
auto_open:
  enabled: false
  lecture: true
  play: true                        # 강의 페이지가 뜨면 플레이어 ▶ 를 눌러 줌 (Windows, 버튼을 이름으로 찾음)
  quiz: true                        # Canvas 퀴즈 페이지 · 퀴즈 복습은 퀴즈 앱
  assignment: true
  draft_hours_before: 3             # 과제 블록 몇 시간 전에 초안을 미리 쓸지 (0 이면 안 씀, 구독 사용량 씀)
  late_limit_minutes: 15            # 노트북이 늦게 깨면 이만큼 지난 블록까지만 연다
  watch: true                       # 강의 동안 확인창("계속 보시겠습니까?") 지켜보기 — 자리에 있으면(최근 입력 idle_seconds 안) 누르고, 없으면 알림만
  idle_seconds: 120
  speed: {}                         # 과목별 배속, 예) {생화학: 1.5, 약학윤리: 1.25} — 버튼 이름은 python -m pa.autoplay --list <강의 제목>
  exam_check_minutes: 30            # 퀴즈·시험 블록 이만큼 전에 점검 (배터리·인터넷·절전 막기)


# 자동 제출 (먼저 내고 나중에 확인 — pa/autosubmit.py). 대상: reserved = 시간을 정했거나 ⋯ '자동 제출 켜기' 한 Canvas 과제,
#   all = 제외하지 않은 모든 Canvas 파일 제출 과제. 정한 시간이 끝날 때, 늦어도 마감 hours_before_due 시간 전에 낸다.
#   보고서가 없으면 draft_lead_minutes 분 전에 AI 가 빈칸 없이 다 쓴다 (draft_if_missing). 낸 뒤 대시보드 '확인 필요' + 캘린더 알림.
auto_submit:
  enabled: true
  scope: reserved
  hours_before_due: 6
  draft_if_missing: true
  draft_lead_minutes: 90
  remind_after_hours: 1             # 확인 안 했으면 다시 알림
  remind_before_due_hours: 3
# 퀴즈 도움 (AI 도움이 허용된 퀴즈만) — 퀴즈 페이지가 열리면 minutes 분 동안, 찍은 스크린샷(Win+Shift+S·PrtSc)을
#   AI 에 보내 답·풀이를 받는다 → materials/<과목>/퀴즈풀이/ 에 사진과 함께 (pa/quizhelp.py). 답 체크·제출은 직접.
#   그 시간 밖에 찍은 스크린샷은 보내지 않는다. 손으로: bin/pa quiz-help <키> | off
quiz_help:
  enabled: false
  minutes: 120
  screenshots_dir: ""               # 비우면 Windows '사진\Screenshots' 폴더를 찾아 씀

reminders:
  plan_minutes_before: 10             # '학습 계획' 블록 시작 몇 분 전 (0 이면 알림 없음, [10, 0] 은 10분 전·시작할 때)
  deadline_minutes_before: [1440, 180, 60]   # '과제' 마감 하루 전 · 3시간 전 · 1시간 전 (최대 5개)
  # 마감 직전 촘촘한 알림: N분 전부터 M분마다 (0 이면 끔, 최대 60분). 같은 때 마감은 알림 하나로 합친다
  dense_from_minutes: 0
  dense_every_minutes: 2

# PC 전원 (pa/power.py) — 내가 정한 예약(고급 예약·시간을 정한 강의/퀴즈/과제) wake_before_minutes 분 전에 절전에서 깨운다
#   (Windows 작업 스케줄러 'PA-Wake', 깨면 10분 동안 절전하지 않음). 전원 옵션 '절전 모드 해제 타이머 허용'이 '사용'이어야 함
power:
  wake_for_reservations: true
  wake_before_minutes: 5

# 고급 예약 'AI 에게 지시'의 작업 폴더 (없으면 비서·study_system·report·퀴즈·hra 중 있는 것). AI 는 읽기만, 답은 data/ai-results/
# schedules:
#   folders:
#     공부: ~/study_system

# 하루 마무리 — 습관 블록 하나 (pa/habits.py). window 시간대 안의 빈 곳에 minutes 분, 바쁜 날은 건너뜀. 그 시간이 되면 대시보드를 띄워
#   맨 위에 마무리 카드 (오늘 계획 vs 실제 · 못 끝낸 일 · 내일 미리보기). 습관은 inbox.md 의 '## 습관' 에 (예: - 복습 ~1h 매일 저녁)
daily_review:
  enabled: true
  minutes: 15
  window: "21-23"
